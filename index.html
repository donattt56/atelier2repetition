<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechts-Navi: Die Quest – Atelier 2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFE9; --surface:#FFFFFF; --ink:#13201B; --muted:#56655F;
  --line:#0E5C43; --signal:#D93A24; --gold:#B87E00; --gold-bg:#FFF3D1; --rule:#CFDBD4;
  --ok:#1A7443; --ok-bg:#E2F1E7; --bad:#B0301D; --bad-bg:#FBE6E1; --on-line:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#18241F; --ink:#E6EEEA; --muted:#9AAAA3;
    --line:#3AAE80; --signal:#FF6B53; --gold:#FFC53D; --gold-bg:#3A2E0E; --rule:#2B3A34;
    --ok:#62CC91; --ok-bg:#15301F; --bad:#FF8670; --bad-bg:#3A1B15; --on-line:#0F1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#18241F; --ink:#E6EEEA; --muted:#9AAAA3;
  --line:#3AAE80; --signal:#FF6B53; --gold:#FFC53D; --gold-bg:#3A2E0E; --rule:#2B3A34;
  --ok:#62CC91; --ok-bg:#15301F; --bad:#FF8670; --bad-bg:#3A1B15; --on-line:#0F1714;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:1.0625rem;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:42rem;margin:0 auto;padding:.5rem .75rem 2rem}
h1,h2{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-stretch:112%;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px;border-radius:4px}

/* HUD */
.hud{background:var(--surface);border:2px solid var(--rule);border-radius:14px 14px 0 0;border-bottom:0;
  padding:.5rem .75rem;display:flex;align-items:center;gap:.75rem;justify-content:space-between}
.stars{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:115%;font-size:1.15rem;color:var(--gold);white-space:nowrap}
.stars.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.streak{font-size:.9rem;font-weight:700;color:var(--signal);flex:1}
.inv{display:flex;gap:.3rem}
.slot{width:2rem;height:2rem;border-radius:8px;border:2px dashed var(--rule);display:grid;place-items:center;font-size:1.15rem}
.slot.full{border:2px solid var(--gold);background:var(--gold-bg)}
.quest{background:var(--line);color:var(--on-line);padding:.45rem .75rem;font-weight:700;font-size:.95rem;line-height:1.3}
.stage{position:relative;background:#22352B;line-height:0;border-left:2px solid var(--rule);border-right:2px solid var(--rule)}
canvas{display:block;width:100%;touch-action:manipulation;image-rendering:auto}
.hint{background:var(--surface);border:2px solid var(--rule);border-top:0;border-radius:0 0 14px 14px;padding:.5rem .75rem;min-height:2.6rem;font-size:.95rem}
.hint b{color:var(--line)}

/* Steuerung */
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:1rem;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,3.4rem);grid-template-rows:repeat(3,3.4rem);gap:.25rem}
.dpad button,.act{border:2px solid var(--rule);border-bottom-width:4px;background:var(--surface);border-radius:14px;font-size:1.4rem;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.dpad button:active,.act:active{transform:translateY(2px);border-bottom-width:2px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.act{width:6.2rem;height:6.2rem;border-radius:50%;background:var(--line);color:var(--on-line);border-color:rgba(0,0,0,.25);font-size:1rem;font-weight:700}
.keys{color:var(--muted);font-size:.9rem;margin:.9rem 0 0}

/* Dialog */
.dlg{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.55);display:none;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + .75rem) .75rem calc(env(safe-area-inset-bottom,0px) + .75rem)}
.dlg.open{display:block}
.panel{max-width:38rem;margin:0 auto;background:var(--bg);border-radius:20px;padding:1.1rem 1rem 1.25rem;border:3px solid var(--line);animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.say{display:flex;gap:.7rem;align-items:flex-start;margin:0 0 .9rem}
.say .av{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:1.7rem}
.say .bub{background:var(--surface);border-radius:4px 16px 16px 16px;padding:.7rem .95rem;flex:1;border:2px solid var(--rule)}
.say .who{display:block;font-family:Archivo,Arial,sans-serif;font-weight:800;font-stretch:112%;font-size:.88rem;color:var(--line);margin-bottom:.15rem}
.say.navi .av{border-color:var(--gold);background:var(--gold-bg)}
.say.navi .who{color:var(--gold)}
.say .bub p{margin:0 0 .5rem}.say .bub p:last-child{margin:0}
.scene{border-radius:14px;padding:.8rem .95rem;margin:0 0 .9rem;background:var(--surface);border-left:6px solid var(--line)}
.scene b{display:block;font-family:Archivo,Arial,sans-serif;font-stretch:115%;font-size:.82rem;color:var(--muted);margin-bottom:.2rem}
.qmeta{font-size:.9rem;color:var(--muted);margin:0 0 .7rem}
.asklbl{font-weight:700;margin:0 0 .55rem}
.opts{display:grid;gap:.55rem;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:.8rem;align-items:flex-start;padding:.8rem .95rem;min-height:3.1rem;
  background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;border-radius:14px;cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--bg);color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.5}
.opt.sel{border-color:var(--line);background:var(--gold-bg)}
.opt.sel .k{background:var(--line);color:var(--on-line)}
.opt .k.box{border-radius:6px}
.opt.missed{border-color:var(--ok);border-style:dashed}.opt.missed .k{background:var(--ok);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.warn{color:var(--bad);font-weight:700;margin:.6rem 0 0}
.sort{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.sort li{background:var(--surface);border:2px solid var(--rule);border-radius:14px;padding:.7rem .9rem;display:grid;gap:.45rem}
.sort li.right{border-color:var(--ok);background:var(--ok-bg)}.sort li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.sort select{font:inherit;color:inherit;min-height:2.8rem;padding:.4rem .6rem;border-radius:10px;border:2px solid var(--rule);background:var(--bg);width:100%}
.sort .sfix{font-weight:700;color:var(--bad);font-size:.95rem}.sort .sfix:empty{display:none}
.solol{margin:.3rem 0 0;padding-left:1.3rem}
.casetag{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:115%;font-size:1.15rem;color:var(--line);margin:0 0 .6rem}
.csteps{list-style:none;display:flex;gap:.4rem;margin:0 0 .6rem;padding:0}
.csteps li{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--surface);border:2px solid var(--rule);color:var(--muted)}
.csteps li.c{border-color:var(--signal);color:var(--ink)}.csteps li.y{background:var(--ok);border-color:var(--ok);color:var(--surface)}.csteps li.n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.steplbl{font-weight:700;margin:0 0 .7rem}
.scene.model{border-left-color:var(--gold);margin-top:1rem}
textarea{font:inherit;color:inherit;width:100%;padding:.7rem .9rem;border-radius:12px;border:2px solid var(--rule);background:var(--surface);resize:vertical}
.mini{display:block;margin:0 auto;border-radius:14px;border:3px solid var(--line);touch-action:none;max-width:100%}
.mctl{display:flex;justify-content:center;gap:1rem;margin-top:.8rem}.mctl .btn{min-width:5rem;touch-action:none;font-size:1.3rem}
.mtitle{font-size:1.7rem;font-weight:900;font-stretch:120%;color:var(--line);margin:.1rem 0 .8rem}
.coins{font-family:Archivo,Arial,sans-serif;font-weight:900;font-size:1.05rem;color:var(--gold);white-space:nowrap}
.bonus{font-weight:700;margin:-.4rem 0 .8rem}
.laws{display:grid;gap:.6rem;margin:.2rem 0 0}
.law{background:var(--surface);border-radius:12px;padding:.75rem .95rem;border-left:5px solid var(--line)}
.law h3{font-family:Archivo,Arial,sans-serif;font-stretch:112%;font-size:1rem;margin:0 0 .35rem;color:var(--line)}
.law h3 span{display:block;font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-weight:700;color:var(--ink);font-size:.95rem}
.law p{margin:0 0 .35rem;font-size:.97rem}.law p:last-child{margin:0}
.lawgrp{font-family:Archivo,Arial,sans-serif;font-size:1.1rem;margin:.9rem 0 .1rem;color:var(--ink)}
.lawnote{font-size:.85rem;color:var(--muted);margin:.9rem 0 0}
.pdfmsg{margin:.5rem 0 0;font-weight:700;color:var(--line)}.pdfmsg:empty{display:none}
.slot.egg{border-color:#2F7D4B;background:var(--ok-bg)}
.panel{position:relative}
.xbtn{position:absolute;top:.55rem;right:.55rem;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--rule);background:var(--surface);font-size:1.15rem;font-weight:700;cursor:pointer;line-height:1;z-index:2}
.xbtn:hover{border-color:var(--signal);color:var(--signal)}
.panel:has(.xbtn)>.qmeta:first-of-type{padding-right:3rem}
.fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;cursor:pointer}
.musbtn{width:2.3rem;height:2.3rem;border-radius:50%;border:2px solid var(--rule);background:var(--bg);font-size:1.05rem;cursor:pointer;flex:none}
.ev .evhero{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--line),#0A3F2E);color:#fff;border-radius:18px;padding:1rem;margin:0 0 .9rem}
.ev .ring{flex:none;background:rgba(255,255,255,.95);border-radius:50%}
.ev .rt{font-family:Archivo,Arial,sans-serif;font-weight:900;font-size:40px;fill:#13201B}.ev .rs{font-size:13px;fill:#56655F;font-weight:700}
.evkick{margin:0;font-size:.85rem;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.evname{margin:.1rem 0;font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:118%;font-size:1.7rem;line-height:1.05}
.evrank{display:inline-block;margin:.3rem 0;padding:.25rem .7rem;border-radius:999px;background:#FFD23F;color:#3A2A00;font-weight:800}
.evtext{margin:.3rem 0 0;font-size:.95rem;opacity:.95}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:0 0 1rem}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:2px solid var(--rule);border-radius:14px;padding:.6rem;text-align:center}
.tile b{display:block;font-family:Archivo,Arial,sans-serif;font-weight:900;font-size:1.35rem}.tile span{font-size:.82rem;color:var(--muted)}
.tile.egg{border-color:#2F7D4B;background:var(--ok-bg)}
.evh{font-family:Archivo,Arial,sans-serif;font-size:1.15rem;font-weight:900;margin:.2rem 0 .5rem}
.places{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:0 0 1rem}
@media (max-width:520px){.places{grid-template-columns:1fr}}
.pl{display:flex;gap:.6rem;align-items:center;background:var(--surface);border-radius:14px;padding:.6rem .7rem;border-left:6px solid var(--ok)}
.pl.mid{border-left-color:var(--gold)}.pl.low{border-left-color:var(--signal)}
.plic{font-size:1.6rem}.plb{flex:1;min-width:0}.plb b{display:block}.plb>span{display:block;font-size:.8rem;color:var(--muted)}
.pl .bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin-top:.3rem}.pl .bar i{display:block;height:100%;background:var(--ok)}
.pl.mid .bar i{background:var(--gold)}.pl.low .bar i{background:var(--signal)}
.pls{text-align:right;font-family:Archivo,Arial,sans-serif;font-weight:900;font-size:1.15rem}.pls em{display:block;font-style:normal;font-size:.75rem;font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:var(--muted)}
.fbgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:620px){.fbgrid{grid-template-columns:1fr}}
.fbc{background:var(--surface);border-radius:14px;padding:.8rem .9rem;border-top:5px solid var(--ok)}.fbc.pot{border-top-color:var(--signal)}
.fbc h2{font-size:1.02rem;font-weight:900;margin:0 0 .5rem}.fbc ul{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.fbc li b{display:block;line-height:1.25}.fbc li span{display:block;font-size:.86rem;color:var(--muted)}
.fbc .chip{display:inline-block!important;margin:.2rem 0;padding:.05rem .5rem;border-radius:999px;background:var(--bad-bg);color:var(--bad)!important;font-weight:700}
.fbc .tip{color:var(--ink)!important}
.pdfbox{background:var(--gold-bg);border-radius:14px;padding:.9rem 1rem;margin-top:1rem}.pdfbox p{margin:0 0 .6rem}
.teach{margin-top:1.4rem;border-top:1px solid var(--rule);padding-top:.7rem}
.teach summary{cursor:pointer;font-weight:700;color:var(--muted)}
.teach p{margin:.6rem 0;font-size:.95rem}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:1rem}
.verdict{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:118%;font-size:1.2rem;margin:0 0 .3rem}
.fb.ok .verdict{color:var(--ok)}.fb.no .verdict{color:var(--bad)}
.ref{display:inline-block;margin-top:.15rem;padding:.2rem .65rem;border-radius:6px;background:var(--bg);font-weight:700;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3.1rem;padding:.7rem 1.4rem;border-radius:14px;border:0;border-bottom:4px solid rgba(0,0,0,.25);cursor:pointer;
  background:var(--line);color:var(--on-line);font-weight:700;font-size:1.05rem}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--surface);color:var(--line);border:2px solid var(--line);border-bottom-width:4px}
.row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem}
.title h1{font-size:clamp(2.3rem,10vw,3.4rem);line-height:.93;font-weight:900;font-stretch:125%;margin:.2rem 0 .2rem;color:var(--line)}
.title .sub{margin:0 0 1rem;color:var(--muted);font-weight:700}
.namebox label{display:block;font-weight:700;margin-bottom:.35rem}
.namebox input{width:100%;max-width:20rem;min-height:3rem;padding:.6rem .9rem;border-radius:12px;border:2px solid var(--rule);background:var(--surface)}
.howto{margin:.9rem 0 0;padding:0;list-style:none;font-size:.97rem}
.howto li{padding:.35rem 0;border-top:1px solid var(--rule)}
kbd{font-family:inherit;font-weight:700;background:var(--surface);border:2px solid var(--rule);border-bottom-width:3px;border-radius:6px;padding:0 .4rem}
.loot{text-align:center;margin:.5rem 0 1rem}
.loot .item{font-size:4.5rem;line-height:1;display:inline-block;animation:loot .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes loot{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.loot .iname{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:118%;font-size:1.3rem;margin:.4rem 0 0}
.big{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:125%;font-size:clamp(2.6rem,12vw,3.8rem);line-height:1;color:var(--gold);margin:.25rem 0}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.rank{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:120%;font-size:1.5rem;color:var(--line);margin:.25rem 0 .75rem}
.bars{list-style:none;margin:1rem 0;padding:0;display:grid;gap:.8rem}
.bars li{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .6rem;align-items:center}
.bars .ic{font-size:1.4rem;grid-row:span 2}
.bars .bar{grid-column:2/-1;height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--line)}
.bars li.weak .bar i{background:var(--signal)}
.bars .lbl{font-weight:700}
.note{background:var(--surface);border-radius:14px;padding:.9rem 1rem;margin-top:1rem;border:2px dashed var(--rule)}
.note p{margin:0 0 .4rem}.note p:last-child{margin:0}
.fbk{background:var(--surface);border-radius:14px;padding:.9rem 1rem;margin-top:1rem;border-left:6px solid var(--ok)}
.fbk.pot{border-left-color:var(--signal)}
.fbk h2{font-size:1.1rem;font-weight:900;margin:0 0 .5rem}
.fbk ul{margin:0;padding:0;list-style:none;display:grid;gap:.65rem}
.fbk li b{display:block}
.fbk li span{display:block;font-size:.95rem;color:var(--muted)}
.fbk li em{font-style:normal;font-weight:700;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="stars" id="stars" aria-live="polite">⭐ 0</span><span class="coins" id="coins"></span>
    <span class="streak" id="streak"></span>
    <span class="inv" id="inv" aria-label="Inventar"></span><button class="musbtn" id="mus" type="button" aria-label="Musik ausschalten">🔊</button>
  </div>
  <div class="quest" id="quest" aria-live="polite">Quest</div>
  <div class="stage"><canvas id="cv" aria-label="Spielfeld: Bewegen Sie die Figur mit den Pfeiltasten"></canvas></div>
  <div class="hint" id="hint"></div>
  <div class="pad">
    <div class="dpad" aria-label="Steuerkreuz">
      <button class="u" data-d="up" aria-label="hoch">▲</button>
      <button class="l" data-d="left" aria-label="links">◀</button>
      <button class="r" data-d="right" aria-label="rechts">▶</button>
      <button class="d" data-d="down" aria-label="runter">▼</button>
    </div>
    <button class="act" id="act">Sprechen</button>
  </div>
  <p class="keys">Tastatur: <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> oder <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> zum Laufen, <kbd>Leertaste</kbd> zum Sprechen.</p>
</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
/* ================= Inhalte ================= */
const NAVI="🧭";
const PLACES=[
  {name:"Rathausplatz",icon:"🏛️",item:"🗝️",iname:"Schlüssel der Rechtsordnung",chap:"Kapitel 2.1 und 2.2"},
  {name:"Shoppingcenter",icon:"🛍️",item:"🪪",iname:"Ausweis der Handlungsfähigkeit",chap:"Kapitel 2.3 und 2.4"},
  {name:"Lehrbetrieb",icon:"🏭",item:"📜",iname:"Siegel des Lehrvertrags",chap:"Kapitel 2.5 und 2.6"},
  {name:"Pausenraum",icon:"☕",item:"🤝",iname:"Karte der Konfliktlösung",chap:"Kapitel 2.6 und 2.7"}
];
const RF=["Richtig","Falsch"], REGEL=["Rechtliche Regel","Betriebliche oder gesellschaftliche Regel","Moralische Vorstellung"];
// a = Index der richtigen Antwort; fix = Reihenfolge nicht mischen
const NPCS=[
/* ---------- Rathausplatz ---------- */
{z:0,x:5,y:16,av:"🧑",name:"Stadtführer Jonas",qs:[
 {type:"multi",q:"Welche Begriffe gehören zu den Funktionen des Rechts? Wählen Sie alle richtigen Antworten.",opts:["Ordnung","Sicherheit","Gerechtigkeit","Schutz","Konfliktlösung","Unterhaltung","Vorteile für Mächtige"],correct:[0,1,2,3,4],
  why:"Das Recht hat fünf Funktionen: Ordnung, Sicherheit, Gerechtigkeit, Schutz und Konfliktlösung. Es gilt für alle gleich, gerade auch für jene mit Geld, Macht und Einfluss."},
 {q:"Die Schweiz ist ein Rechtsstaat. Was bedeutet das?",opts:["Alle sind an das Recht gebunden, auch die Mächtigen.","Der Staat darf alles bestimmen.","Jede Person hat immer recht.","Nur Richterinnen und Richter müssen sich an Gesetze halten."],a:0,
  why:"In einem Rechtsstaat gelten die Regeln für alle, auch für jene, die Geld, Macht und Einfluss haben. Auch der Staat selbst muss sich an das Recht halten."}]},
{z:0,x:11,y:16,av:"👵",name:"Frau Huber",qs:[
 {c:"Noah bietet im Tram einer älteren Person seinen Sitzplatz nicht an.",
  q:"Welche Art von Regel verletzt Noah?",fix:true,opts:REGEL,a:2,
  why:"Die Regel steht in keinem Gesetz und in keinem Vertrag. Eine rechtliche Folge hat Noah nicht zu erwarten, höchstens böse Blicke (soziale Sanktion)."},
 {q:"Recht, Moral, Ethik: Welche Frage stellt die Ethik?",opts:["Warum ist das richtig, und ist es gerecht?","Was gilt?","Was gehört sich?","Wer bezahlt die Busse?"],a:0,
  why:"Das Recht fragt: Was gilt? Die Moral fragt: Was gehört sich? Die Ethik denkt über beides nach und fragt nach den Gründen. Sie ist die Grundlage, um Regeln zu verändern."}]},
{z:0,x:3,y:19,av:"👷",name:"Sam, Lernender Logistik",qs:[
 {c:"In Ihrem Lehrbetrieb gilt: Während der Arbeit bleibt das Handy im Spind.",
  q:"Welche Art von Regel ist das?",fix:true,opts:REGEL,a:1,
  why:"Der Betrieb hat die Regel festgelegt. Sie gilt in dieser Organisation und stützt sich auf den Lehrvertrag. Ein Verstoss kann deshalb trotzdem eine rechtliche Folge haben, zum Beispiel eine Verwarnung."},
 {c:"Elira sagt: «Diese Regel ist unfair, also gilt sie auch nicht.»",
  q:"Stimmt Eliras Aussage?",fix:true,opts:RF,a:1,
  why:"Ob eine Regel gilt, ist eine rechtliche Frage: Steht sie in einem Gesetz, einem Vertrag oder einer Weisung? Ob sie gerecht ist, ist eine Frage der Moral. Eine Regel kann gelten, obwohl viele sie unfair finden. Ändern kann man sie über die Politik."}]},
{z:0,x:12,y:20,av:"👮",name:"Polizist Brunner",qs:[
 {type:"sort",q:"Öffentliches oder privates Recht? Ordnen Sie jede Situation zu.",cats:["Öffentliches Recht","Privates Recht"],
  items:[["Luca fährt über Rot, die Polizei büsst ihn.",0],["Leilas neues Smartphone ist kaputt, sie verlangt vom Geschäft Ersatz.",1],["Die Gemeinde schickt Ihnen die Steuerrechnung.",0],["Sie mieten eine Wohnung und unterschreiben den Mietvertrag.",1]],
  why:"Faustregel: Steht der Staat mit seiner Macht einer Person gegenüber (Busse, Steuern), ist es öffentliches Recht. Stehen sich Personen oder Unternehmen auf Augenhöhe gegenüber (Kauf, Miete), ist es privates Recht."},
 {type:"case",title:"Die saubere Gemeinde",c:"Eine Gemeinde will den öffentlichen Raum sauberer machen und beschliesst: «Wer nach 20 Uhr auf einem öffentlichen Platz Getränke konsumiert, bezahlt eine Busse von 300 Franken.» Viele finden das übertrieben. Einige fragen sich, ob die Gemeinde das überhaupt darf.",
  steps:[
   {label:"Rechtsbereich bestimmen",q:"Um welchen Rechtsbereich geht es?",fix:true,opts:["Öffentliches Recht","Privates Recht"],a:0,why:"Die Gemeinde greift in das Verhalten aller ein und droht eine Busse an. Der Staat handelt mit hoheitlicher Macht."},
   {label:"Recht und Ethik trennen",q:"«300 Franken für ein Mineralwasser sind unfair.» Auf welcher Ebene liegt dieses Argument?",opts:["Ethik: Es geht um die Frage, ob die Regel gerecht ist.","Recht: Damit ist bewiesen, dass die Regel nicht gilt.","Es ist eine betriebliche Regel.","Es ist eine Frage des privaten Rechts."],a:0,why:"Ob eine Regel fair ist, ist eine ethische Frage. Ob sie gilt, ist eine rechtliche Frage. Beides muss man auseinanderhalten."},
   {label:"Stufen der Rechtsordnung anwenden",q:"Was muss rechtlich geprüft werden?",opts:["Ob die Gemeinde zuständig ist und ob die Regel zum kantonalen Gesetz und zur Verfassung passt","Ob die Mehrheit der Leute die Regel gut findet","Ob andere Gemeinden dieselbe Regel haben","Ob die Busse schon einmal bezahlt wurde"],a:0,why:"Die Gemeinde ist die unterste Staatsebene. Ihre Regeln dürfen dem kantonalen Recht und der Verfassung nicht widersprechen."},
   {label:"Beurteilen und begründen",q:"Können Sie den Fall jetzt abschliessend beurteilen?",opts:["Nein. Zuerst muss ich das Gesetz kennen, auf das sich die Gemeinde stützt.","Ja, die Regel ist ungültig, weil sie unfair ist.","Ja, die Regel gilt sicher, weil die Gemeinde sie beschlossen hat.","Ja, Bussen sind immer verboten."],a:0,why:"Eine gute Falllösung sagt, wenn eine Information fehlt. Ein pauschales Verbot hat zudem ein Problem mit der Verhältnismässigkeit, einem Grundsatz der Verfassung."}],
  model:"Die Regel gehört zum öffentlichen Recht. Ob sie fair ist, ist eine ethische Frage. Rechtlich entscheidend ist, ob die Gemeinde zuständig ist und ob die Regel zum kantonalen Gesetz und zur Verfassung passt (Verhältnismässigkeit). Ohne das Gesetz zu kennen, auf das sich die Gemeinde stützt, kann ich den Fall nicht abschliessend beurteilen."}]},
{z:0,x:8,y:15,av:"🎩",name:"Gemeindeschreiber Vogt",qs:[
 {
  q:"Die Schweizer Rechtsordnung hat drei Stufen. Welche Reihenfolge stimmt, wenn Sie mit der grundlegendsten Regel beginnen, auf der alle anderen aufbauen?",opts:["Verfassung, Gesetz, Verordnung","Gesetz, Verfassung, Verordnung","Verordnung, Gesetz, Verfassung","Verfassung, Verordnung, Gesetz"],a:0,
  why:"Die Verfassung ist die Grundlage für alles: Sie legt fest, wie der Staat aufgebaut ist, und garantiert die Grundrechte. Die Gesetze regeln einzelne Bereiche genauer. Die Verordnungen bestimmen, wie ein Gesetz im Detail umgesetzt wird. Keine Regel darf der Stufe widersprechen, auf der sie aufbaut."},
 {c:"Sie lösen einen Fall und wollen belegen, wo die Regel steht: im Obligationenrecht, Artikel 345a, Absatz 1.",
  q:"Wie zitieren Sie diese Fundstelle korrekt?",opts:["Art. 345a Abs. 1 OR","OR, Seite 345","Gesetz Nr. 345a, 1. Zeile","Obligationenrecht, Kapitel 345a"],a:0,
  why:"Zu einer Fundstelle gehören der Artikel, bei Bedarf der Absatz und die Abkürzung des Gesetzes. So findet jede Person die Stelle in Sekunden. In diesem Atelier gilt: Jede rechtliche Antwort braucht eine Fundstelle."}]},

/* ---------- Shoppingcenter ---------- */
{z:1,x:20,y:17,av:"👵",name:"Milas Grossmutter",qs:[
 {c:"Mila ist drei Monate alt. Ihre Grossmutter schenkt ihr 2000 Franken.",
  q:"Kann Mila das Geld besitzen?",opts:["Ja, jeder Mensch ist rechtsfähig.","Nein, erst ab 18 Jahren.","Nein, erst wenn sie urteilsfähig ist.","Nur wenn ein Gericht zustimmt."],a:0,
  why:"Rechtsfähig ist jeder Mensch, von der Geburt bis zum Tod. Mila wird Eigentümerin. Über das Geld verfügen dürfen aber nur ihre Eltern als gesetzliche Vertretung.",ref:"Art. 11 ZGB"},
 {type:"sort",q:"Wer kann was? Ordnen Sie jeder Person die passende Handlungsfähigkeit zu.",cats:["Voll handlungsfähig","Beschränkt handlungsfähig","Nicht handlungsfähig"],
  items:[["Mila, 3 Monate alt",2],["Aron, 15, versteht den Kauf eines T-Shirts und seine Folgen",1],["Lina, 17, versteht die Folgen ihrer Entscheidung in dieser Situation nicht",2],["David, 20, urteilsfähig",0]],
  why:"Voll handlungsfähig ist, wer volljährig und urteilsfähig ist (David). Wer minderjährig, aber urteilsfähig ist, ist beschränkt handlungsfähig (Aron). Wer nicht urteilsfähig ist, ist nicht handlungsfähig, egal wie alt (Mila und Lina). Rechtsfähig sind alle vier.",ref:"Art. 13, Art. 17 und Art. 19 ZGB"}]},
{z:1,x:23,y:20,av:"🧑",name:"Amir",qs:[
 {type:"sort",c:"Eine Kollegin ist 17 und urteilsfähig. Sie fragt, was sie ohne ihre Eltern abschliessen darf.",q:"Allein möglich oder nur mit Zustimmung? Ordnen Sie jedes Geschäft zu.",cats:["Allein möglich","Nur mit Zustimmung der Eltern"],
  items:[["Ein Kinobillett vom eigenen Lohn kaufen",0],["Ein Fitnessabo mit zwölf Monaten Mindestlaufzeit abschliessen",1],["Ein Geburtstagsgeschenk annehmen",0],["Einen Roller auf Raten kaufen",1]],
  why:"Urteilsfähige Minderjährige dürfen allein Geschenke annehmen, kleine Alltagsgeschäfte tätigen und über ihren Arbeitslohn verfügen. Für wichtige Geschäfte mit hohem Betrag, langer Laufzeit, regelmässigen Zahlungen oder Schulden brauchen sie die Zustimmung der gesetzlichen Vertretung.",ref:"Art. 19 und Art. 323 ZGB"},
 {c:"«Meine Schwester ist 17 und möchte etwas Wichtiges unterschreiben. Sie sagt, sie verstehe alles. Unsere Eltern sind dagegen.» Mehr wissen Sie nicht.",
  q:"Darf die Schwester allein unterschreiben?",opts:["Nicht bestimmbar: Es fehlt, um welches Geschäft es geht.","Ja, weil sie alles versteht.","Nein, unter 18 darf man nie unterschreiben.","Ja, weil sie fast volljährig ist."],a:0,
  why:"Die Schwester ist beschränkt handlungsfähig. Ob sie allein unterschreiben darf, hängt vom Geschäft ab: Ein Kauf vom eigenen Lohn ginge allein, eine Verpflichtung mit Laufzeit oder hohem Betrag nur mit Zustimmung. Eine gute Falllösung sagt, wenn eine Information fehlt.",ref:"Art. 19 ZGB"}]},
{z:1,x:21,y:15,av:"🧔",name:"Verkäufer Marco",qs:[
 {q:"Wer ist voll handlungsfähig?",opts:["Wer volljährig und urteilsfähig ist","Wer volljährig ist","Wer urteilsfähig ist","Wer einen eigenen Lohn verdient"],a:0,
  why:"Es braucht beides: Volljährigkeit und Urteilsfähigkeit. Wer mit 17 alles versteht, ist noch nicht voll handlungsfähig. Wer mit 30 betrunken ist, in diesem Moment auch nicht.",ref:"Art. 13, Art. 14 und Art. 16 ZGB"},
 {c:"Eine Kundin legt ein Sandwich auf das Band, bezahlt und geht. Niemand sagt ein Wort.",
  q:"Ist ein Vertrag zustande gekommen?",opts:["Ja, ein Vertrag kann auch stillschweigend entstehen.","Nein, es wurde nichts unterschrieben.","Nein, es wurde nichts gesagt.","Nur, wenn die Kundin die Quittung behält."],a:0,
  why:"Ein Vertrag kommt zustande, wenn sich zwei Seiten einig sind. Das geht mündlich, schriftlich oder stillschweigend. Die meisten Verträge brauchen keine bestimmte Form.",ref:"Art. 1 und Art. 11 OR"}]},
{z:1,x:29,y:15,av:"👩",name:"Autohändlerin Frey",qs:[
 {c:"David ist 30. Im Vollrausch unterschreibt er einen Kaufvertrag für ein teures Auto.",
  q:"Was gilt für diesen Vertrag?",opts:["Er ist nichtig.","Er ist gültig, weil David volljährig ist.","Er ist gültig, wenn David ihn nicht innert einer Woche kündigt.","Er braucht die Zustimmung von Davids Eltern."],a:0,
  why:"Im Vollrausch ist David nicht urteilsfähig und damit nicht handlungsfähig. Was in diesem Zustand unterschrieben wird, ist von Anfang an unwirksam.",ref:"Art. 17 und Art. 18 ZGB"},
 {type:"case",title:"Yassin und das Smartphone",c:"Yassin ist 16 und im ersten Lehrjahr als Koch. An einem Samstagabend bestellt er online ein schwarzes Smartphone für 1200 Franken auf Rechnung. Er versteht, was er bestellt und dass er die Rechnung bezahlen muss. Seine Eltern wissen nichts davon.",
  steps:[
   {label:"Sachverhalt klären",type:"multi",q:"Welche Angaben sind für die rechtliche Beurteilung wichtig? Wählen Sie alle wichtigen.",opts:["Yassin ist 16 Jahre alt.","Er versteht den Kauf und die Folgen.","Das Smartphone kostet 1200 Franken, auf Rechnung.","Die Eltern wissen nichts davon.","Das Smartphone ist schwarz.","Er bestellt an einem Samstagabend."],correct:[0,1,2,3],why:"Wichtig sind Alter, Urteilsfähigkeit, Art des Geschäfts und die Zustimmung der Eltern. Farbe und Wochentag spielen keine Rolle."},
   {label:"Urteilsfähigkeit prüfen",q:"Ist Yassin in dieser Situation urteilsfähig?",opts:["Ja, er versteht Bedeutung und Folgen des Kaufs.","Nein, mit 16 ist man nie urteilsfähig.","Nicht bestimmbar, dazu steht nichts im Fall.","Nein, weil seine Eltern nichts wissen."],a:0,why:"Der Fall sagt es ausdrücklich: Yassin versteht, was er bestellt und dass er bezahlen muss. Ein Alter nennt das Gesetz für die Urteilsfähigkeit nicht.",ref:"Art. 16 ZGB"},
   {label:"Handlungsfähigkeit beurteilen",q:"Welche Handlungsfähigkeit hat Yassin?",fix:true,opts:["Voll handlungsfähig","Beschränkt handlungsfähig","Nicht handlungsfähig"],a:1,why:"Yassin ist urteilsfähig, aber minderjährig. Er ist beschränkt handlungsfähig.",ref:"Art. 19 ZGB"},
   {label:"Art des Geschäfts bestimmen",q:"Um was für ein Geschäft handelt es sich?",opts:["Ein wichtiges Geschäft: hoher Betrag und Schulden durch den Kauf auf Rechnung","Ein kleines Alltagsgeschäft","Ein Geschenk, das nichts kostet","Gar kein Rechtsgeschäft"],a:0,why:"1200 Franken auf Rechnung sind viel mehr als ein Alltagskauf. Yassin bezahlt nicht sofort aus seinem Lohn, sondern macht Schulden."},
   {label:"Beurteilen und begründen",q:"Ist der Kaufvertrag gültig?",opts:["Noch nicht: Er wird erst mit der Zustimmung der Eltern gültig.","Ja, weil Yassin urteilsfähig ist.","Ja, weil er einen Lehrlingslohn verdient.","Nein, er ist nichtig, und die Eltern können daran nichts ändern."],a:0,why:"Für wichtige Geschäfte braucht eine beschränkt handlungsfähige Person die Zustimmung der gesetzlichen Vertretung. Sie kann vorher oder nachher erfolgen.",ref:"Art. 19 ZGB"}],
  model:"Yassin ist 16 und versteht den Kauf. Er ist also urteilsfähig (Art. 16 ZGB), aber minderjährig und damit beschränkt handlungsfähig (Art. 19 ZGB). Ein Smartphone für 1200 Franken auf Rechnung ist kein Alltagsgeschäft. Der Vertrag ist deshalb erst gültig, wenn die Eltern zustimmen."}]},
{z:1,x:29,y:20,av:"🎧",name:"Jamie",qs:[
 {c:"Jamie ist 17 und urteilsfähig. Sie kauft von ihrem Lehrlingslohn Kopfhörer für 80 Franken.",
  q:"Darf Jamie das ohne ihre Eltern?",opts:["Ja, über ihren Arbeitslohn darf sie selbst verfügen.","Nein, unter 18 braucht es immer die Zustimmung.","Nein, sie ist noch nicht rechtsfähig.","Nur wenn der Lehrbetrieb einverstanden ist."],a:0,
  why:"Jamie ist beschränkt handlungsfähig. Kleine Alltagsgeschäfte und Käufe mit dem eigenen Lohn darf sie allein abschliessen.",ref:"Art. 19 und Art. 323 ZGB"},
 {c:"Jamies Freundin Selin ist 17 und urteilsfähig. Sie will einen Handyvertrag mit 24 Monaten Laufzeit abschliessen.",
  q:"Was gilt für Selin?",opts:["Sie braucht die Zustimmung ihrer Eltern.","Sie darf allein entscheiden, weil sie urteilsfähig ist.","Der Vertrag ist nichtig, egal was die Eltern sagen.","Sie darf ihn abschliessen, wenn der Anbieter einverstanden ist."],a:0,
  why:"Ein Vertrag, der Selin zwei Jahre lang jeden Monat verpflichtet, ist ein wichtiges Rechtsgeschäft. Dafür braucht sie die Zustimmung der gesetzlichen Vertretung, vorher oder nachher.",ref:"Art. 19 ZGB"}]},

/* ---------- Lehrbetrieb ---------- */
{z:2,x:27,y:8,av:"🗂️",name:"Herr Keller, Lehraufsicht",qs:[
 {q:"Welche Aussage zum Lehrvertrag stimmt?",opts:["Er muss schriftlich sein und vom Kanton genehmigt werden.","Ein Handschlag genügt, wie bei den meisten Verträgen.","Er gilt, sobald die lernende Person unterschrieben hat.","Er muss bei einer Notarin beglaubigt werden."],a:0,
  why:"Die meisten Verträge sind formfrei (Art. 11 OR). Für den Lehrvertrag verlangt das Gesetz aber die Schriftform. In Basel-Stadt genehmigt ihn die Fachstelle Lehraufsicht.",ref:"Art. 344a OR, Art. 14 BBG"},
 {q:"In welchem Gesetz finden Sie die Regeln zu Probezeit, Lohn, Ferien und Pflichten im Lehrverhältnis?",opts:["Obligationenrecht (OR)","Strafgesetzbuch (StGB)","Bundesverfassung (BV)","Strassenverkehrsgesetz (SVG)"],a:0,
  why:"Der Lehrvertrag ist ein besonderer Arbeitsvertrag. Das OR regelt, was zwischen Ihnen und dem Betrieb gilt. Das BBG regelt die Organisation der Berufsbildung.",ref:"Art. 344 bis Art. 346a OR"}]},
{z:2,x:22,y:4,av:"👩",name:"Nora",qs:[
 {type:"multi",c:"Nora ist 17. Sie schliesst einen Lehrvertrag mit dem Kinderhaus Rheinblick ab.",q:"Wer unterschreibt den Lehrvertrag? Wählen Sie alle richtigen Antworten.",opts:["Der Lehrbetrieb","Nora","Noras gesetzliche Vertretung","Die Berufsfachschule","Noras Klassenlehrperson"],correct:[0,1,2],
  why:"Vertragsparteien sind der Betrieb und Nora. Weil Nora minderjährig ist, unterschreibt ihre gesetzliche Vertretung zusätzlich mit. Danach genehmigt der Kanton den Vertrag.",ref:"Art. 344a OR, Art. 14 BBG"},
 {c:"Nora möchte einen Freikurs an der Berufsfachschule besuchen. Der Betrieb sagt: «Dann ziehen wir dir diese Stunden vom Lohn ab.»",
  q:"Darf der Betrieb das?",opts:["Nein, der Besuch ist ohne Lohnabzug zu gestatten.","Ja, Freikurse sind Freizeit.","Ja, wenn es im Betrieb so üblich ist.","Nur im ersten Lehrjahr nicht."],a:0,
  why:"Lernende haben Anspruch auf Stütz- und Freikurse. Der Besuch ist ohne Lohnabzug zu gestatten, bis zu einem halben Tag pro Woche während der Arbeitszeit.",ref:"Art. 22 BBG, Art. 20 BBV"}]},
{z:2,x:26,y:4,av:"👩‍💼",name:"Berufsbildnerin Meier",qs:[
 {type:"sort",q:"Welche Zahl gehört wozu? Ordnen Sie zu.",cats:["1 bis 3 Monate","5 Wochen","7 Tage","9 Stunden"],
  items:[["Dauer der Probezeit",0],["Ferien pro Jahr bis zum vollendeten 20. Altersjahr (mindestens)",1],["Kündigungsfrist in der Probezeit",2],["Höchstarbeitszeit pro Tag für Jugendliche unter 18",3]],
  why:"Diese vier Eckwerte sollten Sie kennen. Der Lehrvertrag darf Sie besser stellen als das Gesetz, aber nicht schlechter.",ref:"Art. 344a OR, Art. 329a OR, Art. 346 OR, Art. 31 ArG"},
 {type:"order",c:"Sie haben eine Frage zu Ihrer Lehre, zum Beispiel: «Wie viele Überstunden darf der Betrieb verlangen?»",q:"In welcher Reihenfolge suchen Sie die Antwort?",
  items:["Im Lehrvertrag nachschauen","Im Gesetz nachschlagen (OR, BBG, Arbeitsgesetz)","Bei der Lehraufsicht nachfragen"],
  why:"Der Suchweg ist immer derselbe: Steht es im Vertrag, gilt der Vertrag, solange er dem Gesetz nicht widerspricht. Steht es nicht im Vertrag, gilt das Gesetz. Bleibt die Frage offen oder gibt es einen Konflikt, hilft die Lehraufsicht."}]},
{z:2,x:31,y:6,av:"🙋",name:"Mia",qs:[
 {c:"Mia sagt: «Wenn im Lehrvertrag nichts dazu steht, gibt es auch keine Regel.»",
  q:"Stimmt Mias Aussage?",fix:true,opts:RF,a:1,
  why:"Der Lehrvertrag regelt nur, was für Sie persönlich vereinbart ist. Alles andere steht im Gesetz (OR, BBG, Arbeitsgesetz). Das Gesetz gilt auch dann, wenn der Vertrag es nicht erwähnt."},
 {c:"Mia lässt aus Unachtsamkeit ein teures Messgerät fallen. Es ist kaputt.",
  q:"Muss Mia für den Schaden haften?",opts:["Grundsätzlich ja, aber Berufsrisiko und Ausbildungsstand werden berücksichtigt.","Nein, Lernende haften nie.","Ja, immer für den vollen Betrag.","Nur, wenn die Eltern eine Versicherung haben."],a:0,
  why:"Lernende haften für Schäden, die sie absichtlich oder fahrlässig verursachen. Dabei zählt aber, wie riskant die Arbeit ist und wie weit die Ausbildung ist. Von Lernenden im ersten Lehrjahr wird weniger erwartet als von Profis.",ref:"Art. 321e OR"}]},
{z:2,x:20,y:9,av:"🧽",name:"Elia",qs:[
 {c:"Elia muss jede Woche mehrere Stunden das Privatauto seines Chefs waschen. Mit seinem Beruf hat das nichts zu tun. Der Chef sagt: «Was hier gilt, entscheide ich.»",
  q:"Wer hat recht?",opts:["Elia: Der Betrieb muss ihn fachgemäss ausbilden.","Der Chef: Er hat das Weisungsrecht.","Der Chef: Lernende müssen jede Arbeit erledigen.","Niemand, weil es nicht im Lehrvertrag steht."],a:0,
  why:"Der Betrieb darf Weisungen erteilen, aber nur im Rahmen von Vertrag und Gesetz. Er muss Lernende fachgemäss ausbilden. Wer Lernende regelmässig für berufsfremde Arbeiten einsetzt, verletzt diese Pflicht.",ref:"Art. 321d OR, Art. 345a OR"},
 {type:"case",title:"Sam und die Sicherheitsschuhe",c:"Sam ist im ersten Lehrjahr in einem Logistikbetrieb. Im Lager sind Sicherheitsschuhe Pflicht. An einem heissen Nachmittag trägt Sam Turnschuhe, weil die Sicherheitsschuhe drücken und «heute sowieso nur Kleinkram» ansteht. Der Berufsbildner schickt Sam nach Hause, um die Schuhe zu holen. Sam findet das übertrieben.",
  steps:[
   {label:"Sachverhalt klären",type:"multi",q:"Welche Angaben sind rechtlich wichtig? Wählen Sie alle wichtigen.",opts:["Im Lager sind Sicherheitsschuhe Pflicht.","Sam trägt Turnschuhe.","Die Sicherheitsschuhe drücken.","Es ist ein heisser Nachmittag.","Sam findet die Regel übertrieben."],correct:[0,1,2],why:"Wichtig sind die Vorschrift, der Verstoss und der Grund (die Schuhe drücken). Das Wetter und Sams Meinung entscheiden den Fall nicht."},
   {label:"Rechtsfrage bestimmen",q:"Welche Rechtsfrage stellt sich?",opts:["Muss Sam die Weisung befolgen, und was muss der Betrieb für seine Sicherheit tun?","Wie viel Lohn bekommt Sam im ersten Lehrjahr?","Darf Sam in der Probezeit kündigen?","Wer bestimmt den Zeitpunkt von Sams Ferien?"],a:0,why:"Es geht um das Weisungsrecht des Betriebs und um seine Pflicht, die Gesundheit der Lernenden zu schützen."},
   {label:"Rechtsgrundlage suchen",q:"Welche Fundstellen passen zum Fall?",opts:["Art. 321d OR (Weisungen befolgen) und Art. 328 OR (Schutz der Gesundheit)","Art. 329c OR (Zeitpunkt der Ferien)","Art. 11 ZGB (Rechtsfähigkeit)","Art. 346 OR (Auflösung des Lehrvertrags)"],a:0,why:"Art. 321d OR regelt das Weisungsrecht, Art. 328 OR die Pflicht des Betriebs, Gesundheit und Persönlichkeit zu schützen."},
   {label:"Regel anwenden",q:"Was bedeuten diese Regeln für Sam und den Betrieb?",opts:["Der Betrieb muss Schutzausrüstung vorschreiben und bereitstellen. Sam muss sie tragen.","Sam darf selbst entscheiden, weil er urteilsfähig ist.","Bei leichten Arbeiten gilt die Vorschrift nicht.","Sam muss passende Schuhe selbst kaufen."],a:0,why:"Unfälle passieren gerade beim Kleinkram, und der Betrieb haftet. Die Schutzausrüstung muss aber der Betrieb zur Verfügung stellen, auch eine, die passt."},
   {label:"Beurteilen und begründen",q:"Wer hat recht?",opts:["Bei der Regel der Berufsbildner, bei den drückenden Schuhen Sam.","Nur Sam.","Nur der Berufsbildner, Sam hat keinerlei Ansprüche.","Niemand, weil nichts dazu im Lehrvertrag steht."],a:0,why:"Sam muss die Weisung befolgen. Er darf aber erwarten, dass der Betrieb drückende Schuhe ersetzt. Das hätte er ansprechen sollen."}],

const LAW=[{"a": "11", "g": "ZGB", "t": "Rechtsfähigkeit", "p": ["¹ Rechtsfähig ist jedermann.", "² Für alle Menschen besteht demgemäss in den Schranken der Rechtsordnung die gleiche Fähigkeit, Rechte und Pflichten zu haben."]}, {"a": "12", "g": "ZGB", "t": "Handlungsfähigkeit: Inhalt", "p": ["Wer handlungsfähig ist, hat die Fähigkeit, durch seine Handlungen Rechte und Pflichten zu begründen."]}, {"a": "13", "g": "ZGB", "t": "Handlungsfähigkeit: Voraussetzungen", "p": ["Die Handlungsfähigkeit besitzt, wer volljährig und urteilsfähig ist."]}, {"a": "14", "g": "ZGB", "t": "Volljährigkeit", "p": ["Volljährig ist, wer das 18. Lebensjahr zurückgelegt hat."]}, {"a": "16", "g": "ZGB", "t": "Urteilsfähigkeit", "p": ["Urteilsfähig im Sinne dieses Gesetzes ist jede Person, der nicht wegen ihres Kindesalters, infolge geistiger Behinderung, psychischer Störung, Rausch oder ähnlicher Zustände die Fähigkeit mangelt, vernunftgemäss zu handeln."]}, {"a": "17", "g": "ZGB", "t": "Handlungsunfähigkeit", "p": ["Handlungsunfähig sind urteilsunfähige Personen, Minderjährige sowie Personen unter umfassender Beistandschaft."]}, {"a": "18", "g": "ZGB", "t": "Fehlen der Urteilsfähigkeit", "p": ["Wer nicht urteilsfähig ist, vermag unter Vorbehalt der gesetzlichen Ausnahmen durch seine Handlungen keine rechtliche Wirkung herbeizuführen."]}, {"a": "19", "g": "ZGB", "t": "Urteilsfähige handlungsunfähige Personen", "p": ["¹ Urteilsfähige handlungsunfähige Personen können nur mit Zustimmung ihres gesetzlichen Vertreters Verpflichtungen eingehen oder Rechte aufgeben.", "² Ohne diese Zustimmung vermögen sie Vorteile zu erlangen, die unentgeltlich sind, sowie geringfügige Angelegenheiten des täglichen Lebens zu besorgen.", "³ Sie werden aus unerlaubten Handlungen schadenersatzpflichtig."]}, {"a": "19a", "g": "ZGB", "t": "Zustimmung des gesetzlichen Vertreters", "p": ["¹ Sofern das Gesetz nichts anderes bestimmt, kann der gesetzliche Vertreter die Zustimmung ausdrücklich oder stillschweigend im Voraus geben oder das Geschäft nachträglich genehmigen.", "² Der andere Teil wird frei, wenn die Genehmigung nicht innerhalb einer angemessenen Frist erfolgt, die er selber ansetzt oder durch das Gericht ansetzen lässt."]}, {"a": "19b", "g": "ZGB", "t": "Fehlen der Zustimmung", "p": ["¹ Erfolgt die Genehmigung des gesetzlichen Vertreters nicht, so kann jeder Teil die vollzogenen Leistungen zurückfordern. Die handlungsunfähige Person haftet jedoch nur insoweit, als die Leistung in ihrem Nutzen verwendet worden ist oder als sie zur Zeit der Rückforderung noch bereichert ist oder sich böswillig der Bereicherung entäussert hat.", "² Hat die handlungsunfähige Person den andern Teil zur irrtümlichen Annahme ihrer Handlungsfähigkeit verleitet, so ist sie ihm für den verursachten Schaden verantwortlich."]}, {"a": "19c", "g": "ZGB", "t": "Höchstpersönliche Rechte", "p": ["¹ Urteilsfähige handlungsunfähige Personen üben die Rechte, die ihnen um ihrer Persönlichkeit willen zustehen, selbstständig aus; vorbehalten bleiben Fälle, in welchen das Gesetz die Zustimmung des gesetzlichen Vertreters vorsieht.", "² Für urteilsunfähige Personen handelt der gesetzliche Vertreter, sofern nicht ein Recht so eng mit der Persönlichkeit verbunden ist, dass jede Vertretung ausgeschlossen ist."]}, {"a": "31", "g": "ZGB", "t": "Anfang und Ende der Persönlichkeit", "p": ["¹ Die Persönlichkeit beginnt mit dem Leben nach der vollendeten Geburt und endet mit dem Tode.", "² Vor der Geburt ist das Kind unter dem Vorbehalt rechtsfähig, dass es lebendig geboren wird."]}, {"a": "323", "g": "ZGB", "t": "Arbeitserwerb, Berufs- und Gewerbevermögen", "p": ["¹ Was das Kind durch eigene Arbeit erwirbt und was es von den Eltern aus seinem Vermögen zur Ausübung eines Berufes oder eines eigenen Gewerbes herausbekommt, steht unter seiner Verwaltung und Nutzung.", "² Lebt das Kind mit den Eltern in häuslicher Gemeinschaft, so können sie verlangen, dass es einen angemessenen Beitrag an seinen Unterhalt leistet."]}, {"a": "1", "g": "OR", "t": "Abschluss des Vertrages", "p": ["¹ Zum Abschlusse eines Vertrages bedarf es der übereinstimmenden gegenseitigen Willensäusserung der Parteien.", "² Sie kann eine ausdrückliche oder stillschweigende sein."]}, {"a": "11", "g": "OR", "t": "Form der Verträge", "p": ["¹ Verträge bedürfen zu ihrer Gültigkeit nur dann einer besonderen Form, wenn das Gesetz eine solche vorschreibt.", "² Ist über Bedeutung und Wirkung einer gesetzlich vorgeschriebenen Form nicht etwas anderes bestimmt, so hängt von deren Beobachtung die Gültigkeit des Vertrages ab."]}, {"a": "321c", "g": "OR", "t": "Überstundenarbeit", "p": ["² Im Einverständnis mit dem Arbeitnehmer kann der Arbeitgeber die Überstundenarbeit innert eines angemessenen Zeitraumes durch Freizeit von mindestens gleicher Dauer ausgleichen.", "³ Wird die Überstundenarbeit nicht durch Freizeit ausgeglichen und ist nichts anderes schriftlich verabredet oder durch Normalarbeitsvertrag oder Gesamtarbeitsvertrag bestimmt, so hat der Arbeitgeber für die Überstundenarbeit Lohn zu entrichten, der sich nach dem Normallohn samt einem Zuschlag von mindestens einem Viertel bemisst."]}, {"a": "324a", "g": "OR", "t": "Lohn bei Verhinderung des Arbeitnehmers", "p": ["¹ Wird der Arbeitnehmer aus Gründen, die in seiner Person liegen, wie Krankheit, Unfall, Erfüllung gesetzlicher Pflichten oder Ausübung eines öffentlichen Amtes, ohne sein Verschulden an der Arbeitsleistung verhindert, so hat ihm der Arbeitgeber für eine beschränkte Zeit den darauf entfallenden Lohn zu entrichten, samt einer angemessenen Vergütung für ausfallenden Naturallohn, sofern das Arbeitsverhältnis mehr als drei Monate gedauert hat oder für mehr als drei Monate eingegangen ist."]}, {"a": "329a", "g": "OR", "t": "Ferien: Dauer", "p": ["¹ Der Arbeitgeber hat dem Arbeitnehmer jedes Dienstjahr wenigstens vier Wochen, dem Arbeitnehmer bis zum vollendeten 20. Altersjahr wenigstens fünf Wochen Ferien zu gewähren."]}, {"a": "329c", "g": "OR", "t": "Ferien: Zusammenhang und Zeitpunkt", "p": ["¹ Die Ferien sind in der Regel im Verlauf des betreffenden Dienstjahres zu gewähren; wenigstens zwei Ferienwochen müssen zusammenhängen.", "² Der Arbeitgeber bestimmt den Zeitpunkt der Ferien und nimmt dabei auf die Wünsche des Arbeitnehmers soweit Rücksicht, als dies mit den Interessen des Betriebes oder Haushaltes vereinbar ist."]}, {"a": "344", "g": "OR", "t": "Lehrvertrag: Begriff", "p": ["Durch den Lehrvertrag verpflichten sich der Arbeitgeber, die lernende Person für eine bestimmte Berufstätigkeit fachgemäss zu bilden, und die lernende Person, zu diesem Zweck Arbeit im Dienst des Arbeitgebers zu leisten."]}, {"a": "344a", "g": "OR", "t": "Lehrvertrag: Entstehung und Inhalt", "p": ["¹ Der Lehrvertrag bedarf zu seiner Gültigkeit der schriftlichen Form.", "³ Die Probezeit darf nicht weniger als einen Monat und nicht mehr als drei Monate betragen. Haben die Vertragsparteien im Lehrvertrag keine Probezeit festgelegt, so gilt eine Probezeit von drei Monaten."]}, {"a": "345", "g": "OR", "t": "Besondere Pflichten der lernenden Person und ihrer gesetzlichen Vertretung", "p": ["¹ Die lernende Person hat alles zu tun, um das Lehrziel zu erreichen.", "² Die gesetzliche Vertretung der lernenden Person hat den Arbeitgeber in der Erfüllung seiner Aufgabe nach Kräften zu unterstützen und das gute Einvernehmen zwischen dem Arbeitgeber und der lernenden Person zu fördern."]}, {"a": "345a", "g": "OR", "t": "Besondere Pflichten des Arbeitgebers", "p": ["² Er hat der lernenden Person ohne Lohnabzug die Zeit freizugeben, die für den Besuch der Berufsfachschule und der überbetrieblichen Kurse und für die Teilnahme an den Lehrabschlussprüfungen erforderlich ist.", "³ Er hat der lernenden Person bis zum vollendeten 20. Altersjahr für jedes Lehrjahr wenigstens fünf Wochen Ferien zu gewähren."]}, {"a": "346", "g": "OR", "t": "Vorzeitige Auflösung", "p": ["¹ Das Lehrverhältnis kann während der Probezeit jederzeit mit einer Kündigungsfrist von sieben Tagen g /* Aufgabe darstellen: mc | multi | sort | order. cb(ok) nach der Auswertung. */
function renderTask(el,t,cb){
  const type=t.type||"mc"; let locked=false;

    const order=t.fix?idx(t.opts):shuffle(idx(t.opts));

    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const k=+b.dataset.k;
      el.querySelectorAll(".opt").forEach(o=>{const v=+o.dataset.k;o.disabled=true;o.classList.add(v===t.a?"right":v===k?"wrong":"dim")});cb(k===t.a)});
  }else if(type==="multi"){
    const order=shuffle(idx(t.opts));
    el.innerHTML=`<p class="asklbl">Mehrere Antworten sind richtig. Tippen Sie alle an.</p><ul class="opts">${order.map(k=>`<li><button class="opt" aria-pressed="false" data-k="${k}"><span class="k box"></span><span>${esc(t.opts[k])}</span></button></li>`).join("")}</ul>
      <p class="warn" id="tw" hidden>Wählen Sie mindestens eine Antwort.</p><div class="row"><button class="btn" id="chk">Antwort prüfen</button></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const on=b.classList.toggle("sel");b.setAttribute("aria-pressed",on);b.querySelector(".k").textContent=on?"✓":""});
    el.querySelector("#chk").onclick=()=>{ if(locked)return; const sel=[...el.querySelectorAll(".opt.sel")].map(b=>+b.dataset.k);
      if(!sel.length){el.querySelector("#tw").hidden=false;return} locked=true; let ok=true;
      el.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k,c=t.correct.includes(k),s=sel.includes(k);b.disabled=true;
        if(c&&s)b.classList.add("right"); else if(c&&!s){b.classList.add("missed");b.querySelector(".k").textContent="!";ok=false} else if(!c&&s){b.classList.add("wrong");b.querySelector(".k").textContent="✗";ok=false} else b.classList.add("dim")});
      el.querySelector("#tw").hidden=true; el.querySelector("#chk").parentElement.remove(); cb(ok)};
  }else if(type==="sort"){
    const order=shuffle(idx(t.items));
    el.innerHTML=`<p class="asklbl">Wählen Sie bei jeder Zeile die passende Zuordnung.</p><ul class="sort">${order.map(i=>`<li data-i="${i}"><span class="st">${esc(t.items[i][0])}</span><select aria-label="Zuordnung für: ${esc(t.items[i][0])}"><option value="">Bitte wählen …</option>${t.cats.map((c,k)=>`<option value="${k}">${esc(c)}</option>`).join("")}</select><span class="sfix"></span></li>`).join("")}</ul>
      <p class="warn" id="tw" hidden>Ordnen Sie zuerst alle Zeilen zu.</p><div class="row"><button class="btn" id="chk">Antwort prüfen</button></div>`;
    el.querySelector("#chk").onclick=()=>{ if(locked)return; const rows=[...el.querySelectorAll(".sort li")];
      if(rows.some(r=>r.querySelector("select").value==="")){el.querySelector("#tw").hidden=false;return} locked=true; let ok=true;
      rows.forEach(r=>{const i=+r.dataset.i,s=r.querySelector("select"),good=+s.value===t.items[i][1];s.disabled=true;r.classList.add(good?"right":"wrong");
        if(!good){ok=false;r.querySelector(".sfix").textContent="Richtig: "+t.cats[t.items[i][1]]}});
      el.querySelector("#tw").hidden=true; el.querySelector("#chk").parentElement.remove(); cb(ok)};
  }else if(type==="order"){
    let order=shuffle(idx(t.items)); if(order.every((v,i)=>v===i))order.reverse();
    let seq=[];
    el.innerHTML=`<p class="asklbl">Tippen Sie die Schritte in der richtigen Reihenfolge an.</p><ul class="opts">${order.map(k=>`<li><button class="opt" data-k="${k}"><span class="k"></span><span>${esc(t.items[k])}</span></button></li>`).join("")}</ul>
      <div class="row"><button class="btn" id="chk" disabled>Antwort prüfen</button><button class="btn ghost" id="rst">Zurücksetzen</button></div><div id="sol"></div>`;
    const paint=()=>{el.querySelectorAll(".opt").forEach(b=>{const p=seq.indexOf(+b.dataset.k);b.classList.toggle("sel",p>=0);b.querySelector(".k").textContent=p>=0?p+1:""});el.querySelector("#chk").disabled=seq.length<t.items.length};
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const k=+b.dataset.k,p=seq.indexOf(k);if(p>=0)seq.splice(p,1);else seq.push(k);paint()});

    el.querySelector("#chk").onclick=()=>{ if(locked||seq.length<t.items.length)return; locked=true; const ok=seq.every((v,i)=>v===i);
      el.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove("sel");b.classList.add(seq.indexOf(k)===k?"right":"wrong")});

      cb(ok)};
  }

}

/* Falllösung in mehreren Schritten */
function runCase(n,qi,retry,done,meta){
  const q=n.qs[qi], N=q.steps.length; let i=0, right=0; const res=[];
  const head=()=>`<p class="qmeta">${meta||`${PLACES[n.z].icon} ${PLACES[n.z].name}: Frage ${qi+1} von ${n.qs.length} bei ${esc(n.name.split(",")[0])}`}</p>
    <p class="casetag">⚖️ Falllösung: ${esc(q.title)}</p>
    <div class="scene"><b>Der Fall</b>${esc(q.c)}</div>`;
  const dots=()=>`<ol class="csteps" aria-label="Schritte">${q.steps.map((s,k)=>`<li class="${k<i?(res[k]?"y":"n"):k===i?"c":""}">${k+1}</li>`).join("")}</ol>`;
  function step(){
    const s=q.steps[i];
    open(`${head()}${dots()}<p class="steplbl">Schritt ${i+1} von ${N}: ${esc(s.label)}</p>
      ${say(n.av,n.name,`<p>${esc(s.q)}</p>`)}<div id="task"></div><div id="fbx" aria-live="polite"></div>`);
    xClose(retry);
    renderTask($("task"),s,ok=>{ res[i]=ok; if(ok)right++;
      $("fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}">${nav(`<p class="verdict">${ok?"Richtig.":"Nicht ganz."}</p><p>${esc(s.why)}</p>${s.ref?`<span class="ref">Fundstelle: ${esc(s.ref)}</span>`:""}`)}</div>
        <div class="row"><button class="btn" id="next">${i<N-1?"Nächster Schritt":"Zum Urteil"}</button></div>`;
      const nx=$("next"); nx.onclick=()=>{i++; i<N?step():verdict()}; nx.focus({preventScroll:true}); $("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
    });
  }
  function verdict(){
    open(`${head()}${dots()}<p class="steplbl">Ihr Urteil in eigenen Worten</p>
      ${nav(`<p>Schreiben Sie Ihre Falllösung in zwei bis drei Sätzen, mit Fundstelle. So üben Sie für die Prüfung. Danach vergleichen Sie mit der Musterlösung.</p>`)}
      <textarea id="own" rows="4" placeholder="Meine Falllösung …" aria-label="Meine Falllösung"></textarea>
      <div class="row"><button class="btn" data-focus id="showm">Musterlösung zeigen</button></div><div id="fbx" aria-live="polite"></div>`);
    xClose(retry);
    $("showm").onclick=()=>{
      const ok=right>=N-1; record(n,qi,ok,retry); $("showm").parentElement.remove(); $("own").readOnly=true;
      const thanks=ok&&!retry?`<p>${esc(n.name.split(",")[0])} bedankt sich${G.player?" bei "+esc(G.player):""}. +1 ⭐</p>`:"";
      $("fbx").innerHTML=`<div class="scene model"><b>Musterlösung</b>${esc(q.model)}</div>
        <div class="fb ${ok?"ok":"no"}">${nav(`<p class="verdict">${right} von ${N} Schritten richtig</p><p>${ok?"Fall gelöst.":"Für den Stern dürfen Sie höchstens einen Schritt falsch haben."} Vergleichen Sie Ihren Text mit der Musterlösung: Stimmen Urteil, Begründung und Fundstelle?</p>${thanks}`)}</div>
        <div class="row"><button class="btn" id="next">Weiter</button></div>`;
      const nx=$("next"); nx.onclick=()=>done(ok); nx.focus({preventScroll:true}); $("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  }
  step();
}

  doc.setFillColor(14,92,67);doc.rect(0,0,210,34,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(pdfText("Rechts-Navi: Die Quest – Auswertung Atelier 2"),M,12);
  doc.setFont("helvetica","bold");doc.setFontSize(22);doc.text(pdfText(G.player||"–"),M,24);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Datum: "+ds,210-M,24,{align:"right"});
  y=44; line("Repetition Atelier 2 «Rechte haben – Rechte bekommen», ABU EFZ, 1. Lehrjahr",10,"normal",[86,101,95],3);
  line("Spielerin oder Spieler: "+(G.player||"–"),11,"bold",null,2);
  line("Resultat: "+tot+" von "+TOTAL+" Sternen, Rang «"+rank[1]+"»",12,"bold",null,1);
  line("Geschick-Bonus: "+coinsTotal()+" von 75 Münzen"+(G.egg?"  |  Geheimnis entdeckt: Basilisken-Schuppe":""),10,"normal",[86,101,95],4);
  line("Resultat pro Ort",13,"bold",[14,92,67],1);
  PLACES.forEach((p,z)=>line(p.name+" ("+p.chap+"): "+zoneScore(z)+" von "+zoneMax(z)+" richtig",11,"normal",null,0.5)); y+=3;
  const {good,pot}=feedbackData();
  line("Das können Sie schon gut",13,"bold",[26,116,67],1);
  if(good.length)good.forEach(o=>line("• "+TOPICS[o.t][0]+" (alle "+o.m+" richtig, "+TOPICS[o.t][1]+")",11,"normal",null,0.5)); else line("Noch kein Thema ganz ohne Fehler.",11);
  y+=3; line("Hier haben Sie noch Potenzial",13,"bold",[176,48,29],1);
  if(pot.length)pot.forEach(o=>{line("• "+TOPICS[o.t][0]+": "+o.r+" von "+o.m+" richtig, "+TOPICS[o.t][1]+" im Lehrmittel",11,"bold",null,0.3);line("  Tipp: "+TOPICS[o.t][2],10,"normal",[86,101,95],1.5)});
  else line("Kein einziger Fehler. Sie sind bereit für die Prüfung.",11);
  const wl=wrongList(); if(wl.length){y+=3;line("Diese Aufgaben sollten Sie nochmals anschauen",13,"bold",[14,92,67],1);
    wl.forEach(([n,qi])=>{const q=n.qs[qi];line("• "+PLACES[n.z].name+", "+n.name.split(",")[0]+": "+(q.type==="case"?"Falllösung «"+q.title+"»":q.q),10,"normal",null,0.8)})}
  y+=4; line("Erstellt mit dem Rechts-Navi. Die Auswertung zeigt Ihren Stand beim Spielen und ersetzt keine Prüfung.",8,"italic",[86,101,95]);
  const fname="Rechts-Navi_Auswertung"+(G.player?"_"+G.player.replace(/[^A-Za-z0-9ÄÖÜäöüéèà_-]+/g,"_"):"")+".pdf";
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:fname,data:doc.output("blob")});msg.textContent="✓ PDF gespeichert.";return}
    if(window.claude&&window.claude.use){msg.textContent="Das Speichern ist hier leider nicht möglich. Machen Sie stattdessen einen Screenshot.";return}
    doc.save(fname); msg.textContent="✓ PDF wird heruntergeladen.";
  }catch(e){msg.textContent=e&&e.code==="declined"?"Speichern abgebrochen.":"Das PDF konnte nicht gespeichert werden. Machen Sie stattdessen einen Screenshot."}
}
function wrongList(){const l=[];NPCS.forEach(n=>n.qs.forEach((q,qi)=>{if(G.ans[aKey(n,qi)]===false)l.push([n,qi])}));return l}
function ring(pct,size,col,label,sub){const r=size/2-8,c=2*Math.PI*r,off=c*(1-pct);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="10"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="${sub?46:52}%" text-anchor="middle" dominant-baseline="middle" class="rt">${label}</text>${sub?`<text x="50%" y="66%" text-anchor="middle" class="rs">${sub}</text>`:""}</svg>`}
function finale(){
  const tot=total(); let rank=RANKS[0],ri=0; RANKS.forEach((r,i)=>{if(tot>=r[0]){rank=r;ri=i}});
  const wl=wrongList(), {good,pot}=feedbackData(), pct=tot/TOTAL;
  const col=pct>=.8?"var(--ok)":pct>=.5?"var(--gold)":"var(--signal)";
  open(`<div class="ev">
    <div class="evhero">
      ${ring(pct,150,col,tot,"von "+TOTAL+" ⭐")}
      <div><p class="evkick">Quest abgeschlossen${G.teacher?" (Lehrpersonen-Modus)":""}</p>
        <p class="evname">${G.player?esc(G.player):"Ihre Auswertung"}</p>
        <p class="evrank">${["🌱","🔎","🏅","👑"][ri]} ${rank[1]}</p>
        <p class="evtext">${rank[2]}</p></div>
    </div>
    <div class="tiles">
      <div class="tile"><b>${Math.round(pct*100)} %</b><span>richtig gelöst</span></div>
      <div class="tile"><b>🪙 ${coinsTotal()}</b><span>von 75 Münzen</span></div>
      <div class="tile"><b>🔥 ${G.best||0}</b><span>längste Serie</span></div>
      <div class="tile ${G.egg?"egg":""}"><b>${G.egg?"🐉":"❔"}</b><span>${G.egg?"Geheimnis entdeckt":"Geheimnis noch versteckt"}</span></div>
    </div>
    <h2 class="evh">Ihre Orte</h2>
    <div class="places">${PLACES.map((p,z)=>{const s=zoneScore(z),m=zoneMax(z),q=s/m,cl=q>=.8?"ok":q>=.6?"mid":"low";
      return `<div class="pl ${cl}"><span class="plic" aria-hidden="true">${p.icon}</span><div class="plb"><b>${p.name}</b><span>${p.chap}</span>
        <span class="bar"><i style="width:${Math.round(q*100)}%"></i></span></div><span class="pls">${s}/${m}<em>${cl==="ok"?"sitzt":cl==="mid"?"fast":"repetieren"}</em></span></div>`}).join("")}</div>
    <div class="fbgrid">
      <div class="fbc good"><h2>💪 Das können Sie schon gut</h2>${good.length?`<ul>${good.map(o=>`<li><b>${esc(TOPICS[o.t][0])}</b><span>alle ${o.m} richtig · ${TOPICS[o.t][1]}</span></li>`).join("")}</ul>`:`<p>Noch kein Thema ganz ohne Fehler. Rechts sehen Sie, wo Sie ansetzen können.</p>`}</div>
      <div class="fbc pot"><h2>🎯 Hier haben Sie Potenzial</h2>${pot.length?`<ul>${pot.map(o=>`<li><b>${esc(TOPICS[o.t][0])}</b><span class="chip">${o.r} von ${o.m} · ${TOPICS[o.t][1]}</span><span class="tip">💡 ${esc(TOPICS[o.t][2])}</span></li>`).join("")}</ul>`:`<p>Kein einziger Fehler. Sie sind bereit für die Prüfung.</p>`}</div>
    </div>
    <div class="pdfbox"><h2 class="evh">📄 Auswertung als PDF</h2><p>Speichern Sie Ihre Auswertung. Sie ist Ihr Lernplan für die Prüfung.</p>
      <div class="namebox"><label for="pdfname">Ihr Name auf dem PDF</label><input id="pdfname" maxlength="30" autocomplete="off" value="${esc(G.player||"")}" placeholder="Vorname Nachname"></div>
      <div class="row" style="margin-top:.7rem"><button class="btn" id="pdf">📄 Als PDF speichern</button></div><p id="pdfmsg" class="pdfmsg" aria-live="polite"></p></div>
    <div class="row">${wl.length?`<button class="btn" data-focus id="rt">🔁 ${wl.length===1?"Den Fehler":"Die "+wl.length+" Fehler"} nochmals üben</button>`:""}
      <button class="btn ghost" id="back">Zurück in die Stadt</button><button class="btn ghost" id="again">Neue Quest</button></div></div>`);
  if(wl.length)$("rt").onclick=()=>retry(wl,0,0);
  $("back").onclick=close; $("again").onclick=()=>{clearSave();titleScreen()};
  $("pdf").onclick=()=>{const v=$("pdfname").value.trim(); if(!v){$("pdfmsg").textContent="Bitte tragen Sie zuerst Ihren Namen ein.";$("pdfname").focus();return} G.player=v; save(); savePDF()};
}
function retry(list,i,right){
  if(i>=list.length){open(`<p class="big">⭐ ${right}<small> von ${list.length} jetzt richtig</small></p>
    ${nav(`<p>${right===list.length?"Alle Fehler ausgebügelt. Bravo!":"Zu den restlichen Fragen lohnt sich ein Blick ins Lehrmittel."}</p>`)}
    <div class="row"><button class="btn" data-focus id="x">Zum Resultat</button></div>`);$("x").onclick=finale;return}
  ask(list[i][0],list[i][1],true,ok=>retry(list,i+1,right+(ok?1:0)),`Fehler üben: ${i+1} von ${list.length}`);
}
function titleScreen(){
  const s=load();
  G={mode:"title",x:4,y:21,dir:"up",mv:null,ans:{},mini:{},egg:false,player:"",streak:0,best:0,toast:"",toastT:0}; drawHud();hint();
  open(`<section class="title"><h1>Rechts-Navi: Die Quest</h1>
    <p class="sub">Repetition Atelier 2 «Rechte haben – Rechte bekommen»</p>
    ${nav(`<p>Hallo! Ich bin Navi. In dieser Stadt warten 20 Personen an vier Orten auf Ihre Hilfe. Laufen Sie zu ihnen und lösen Sie ihre Rechtsfragen.</p><p>Jeder Ort gibt einen Gegenstand. An den Toren wartet eine Geschicklichkeitsprobe 🎮, am Ende der Pokal 🏆. An jedem Ort hängt ein Anschlag 📌 mit den Gesetzestexten, und Personen mit 💬 erzählen Ihnen etwas. Und vielleicht entdecken Sie ja ein Geheimnis …</p>`)}
    <div class="namebox"><label for="nm">Wie heissen Sie im Spiel?</label><input id="nm" maxlength="20" autocomplete="off" placeholder="Spielname" value="${s&&s.player?esc(s.player):""}"></div>
    <ul class="howto"><li><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> oder <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>: laufen. Auf dem Handy: Steuerkreuz.</li>
      <li><kbd>Leertaste</kbd> oder «Sprechen»: Person ansprechen.</li><li><kbd>1</kbd> bis <kbd>4</kbd>: Antwort wählen, <kbd>Enter</kbd>: weiter.</li><li>Neben Auswahlfragen gibt es Zuordnungen, Reihenfolgen und Falllösungen in mehreren Schritten.</li></ul>
    <div class="row">${s?`<button class="btn" data-focus id="cont">Weiterspielen (${Object.keys(s.ans).length} von ${TOTAL} Fragen)</button><button class="btn ghost" id="go">Neu beginnen</button>`:`<button class="btn" id="go">Quest starten</button>`}</div>
    <details class="teach"><summary>Zugang für Lehrpersonen</summary>
      <p>Mit dem Passwort sind alle Tore offen. Sie können überall hingehen und jede Frage ansehen, ohne dass etwas gewertet wird.</p>
      <div class="namebox"><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="off"></div>
      <p class="warn" id="pwmsg" hidden>Das Passwort stimmt nicht.</p>
      <div class="row"><button class="btn ghost" id="tgo">Als Lehrperson öffnen</button></div></details></section>`);
  const nm=()=>$("nm").value.trim();
  $("go").onclick=()=>{musicStart();clearSave();G.player=nm();close();toast("Los geht’s! Die Personen mit ❗ brauchen Ihre Hilfe.")};
  if(s)$("cont").onclick=()=>{musicStart();G.ans=s.ans;G.mini=s.mini||{};G.egg=!!s.egg;G.player=nm()||s.player||"";if(!blocked(s.x,s.y)){G.x=s.x;G.y=s.y}close()};
  $("nm").onkeydown=e=>{if(e.key==="Enter")(s?$("cont"):$("go")).click()};
  const tgo=()=>{let h=5381;for(const c of $("pw").value.trim().toLowerCase())h=((h<<5)+h+c.charCodeAt(0))>>>0;
    if(h!==811816783){$("pwmsg").hidden=false;return}
    musicStart();G.teacher=true;G.player="";close();toast("Lehrpersonen-Modus: Alle Tore sind offen. Nichts wird gewertet.")};
  $("tgo").onclick=tgo; $("pw").onkeydown=e=>{if(e.key==="Enter")tgo()};
}

resize(); titleScreen(); requestAnimationFrame(tick);
$("mus").addEventListener("click",e=>{e.currentTarget.blur();musicToggle()}); musicBtn();
</script>
</body>
</html>
