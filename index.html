<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechts-Navi: Die Quest – Atelier 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFE9; --surface:#FFFFFF; --ink:#13201B; --muted:#56655F;
  --line:#0E5C43; --signal:#D93A24; --gold:#B87E00; --gold-bg:#FFF3D1; --rule:#CFDBD4;
  --ok:#1A7443; --ok-bg:#E2F1E7; --bad:#B0301D; --bad-bg:#FBE6E1; --on-line:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#18241F; --ink:#E6EEEA; --muted:#9AAAA3;
    --line:#3AAE80; --signal:#FF6B53; --gold:#FFC53D; --gold-bg:#3A2E0E; --rule:#2B3A34;
    --ok:#62CC91; --ok-bg:#15301F; --bad:#FF8670; --bad-bg:#3A1B15; --on-line:#0F1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#18241F; --ink:#E6EEEA; --muted:#9AAAA3;
  --line:#3AAE80; --signal:#FF6B53; --gold:#FFC53D; --gold-bg:#3A2E0E; --rule:#2B3A34;
  --ok:#62CC91; --ok-bg:#15301F; --bad:#FF8670; --bad-bg:#3A1B15; --on-line:#0F1714;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:1.0625rem;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:42rem;margin:0 auto;padding:.5rem .75rem 2rem}
h1,h2{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-stretch:112%;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px;border-radius:4px}

/* HUD */
.hud{background:var(--surface);border:2px solid var(--rule);border-radius:14px 14px 0 0;border-bottom:0;
  padding:.5rem .75rem;display:flex;align-items:center;gap:.75rem;justify-content:space-between}
.stars{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:115%;font-size:1.15rem;color:var(--gold);white-space:nowrap}
.stars.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.streak{font-size:.9rem;font-weight:700;color:var(--signal);flex:1}
.inv{display:flex;gap:.3rem}
.slot{width:2rem;height:2rem;border-radius:8px;border:2px dashed var(--rule);display:grid;place-items:center;font-size:1.15rem}
.slot.full{border:2px solid var(--gold);background:var(--gold-bg)}
.quest{background:var(--line);color:var(--on-line);padding:.45rem .75rem;font-weight:700;font-size:.95rem;line-height:1.3}
.stage{position:relative;background:#22352B;line-height:0;border-left:2px solid var(--rule);border-right:2px solid var(--rule)}
canvas{display:block;width:100%;touch-action:manipulation;image-rendering:auto}
.hint{background:var(--surface);border:2px solid var(--rule);border-top:0;border-radius:0 0 14px 14px;padding:.5rem .75rem;min-height:2.6rem;font-size:.95rem}
.hint b{color:var(--line)}

/* Steuerung */
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:1rem;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,3.4rem);grid-template-rows:repeat(3,3.4rem);gap:.25rem}
.dpad button,.act{border:2px solid var(--rule);border-bottom-width:4px;background:var(--surface);border-radius:14px;font-size:1.4rem;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.dpad button:active,.act:active{transform:translateY(2px);border-bottom-width:2px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.act{width:6.2rem;height:6.2rem;border-radius:50%;background:var(--line);color:var(--on-line);border-color:rgba(0,0,0,.25);font-size:1rem;font-weight:700}
.keys{color:var(--muted);font-size:.9rem;margin:.9rem 0 0}

/* Dialog */
.dlg{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.55);display:none;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + .75rem) .75rem calc(env(safe-area-inset-bottom,0px) + .75rem)}
.dlg.open{display:block}
.panel{max-width:38rem;margin:0 auto;background:var(--bg);border-radius:20px;padding:1.1rem 1rem 1.25rem;border:3px solid var(--line);animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.say{display:flex;gap:.7rem;align-items:flex-start;margin:0 0 .9rem}
.say .av{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:1.7rem}
.say .bub{background:var(--surface);border-radius:4px 16px 16px 16px;padding:.7rem .95rem;flex:1;border:2px solid var(--rule)}
.say .who{display:block;font-family:Archivo,Arial,sans-serif;font-weight:800;font-stretch:112%;font-size:.88rem;color:var(--line);margin-bottom:.15rem}
.say.navi .av{border-color:var(--gold);background:var(--gold-bg)}
.say.navi .who{color:var(--gold)}
.say .bub p{margin:0 0 .5rem}.say .bub p:last-child{margin:0}
.scene{border-radius:14px;padding:.8rem .95rem;margin:0 0 .9rem;background:var(--surface);border-left:6px solid var(--line)}
.scene b{display:block;font-family:Archivo,Arial,sans-serif;font-stretch:115%;font-size:.82rem;color:var(--muted);margin-bottom:.2rem}
.qmeta{font-size:.9rem;color:var(--muted);margin:0 0 .7rem}
.asklbl{font-weight:700;margin:0 0 .55rem}
.opts{display:grid;gap:.55rem;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:.8rem;align-items:flex-start;padding:.8rem .95rem;min-height:3.1rem;
  background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;border-radius:14px;cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--bg);color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:1rem}
.verdict{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:118%;font-size:1.2rem;margin:0 0 .3rem}
.fb.ok .verdict{color:var(--ok)}.fb.no .verdict{color:var(--bad)}
.ref{display:inline-block;margin-top:.15rem;padding:.2rem .65rem;border-radius:6px;background:var(--bg);font-weight:700;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3.1rem;padding:.7rem 1.4rem;border-radius:14px;border:0;border-bottom:4px solid rgba(0,0,0,.25);cursor:pointer;
  background:var(--line);color:var(--on-line);font-weight:700;font-size:1.05rem}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--surface);color:var(--line);border:2px solid var(--line);border-bottom-width:4px}
.row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem}
.title h1{font-size:clamp(2.3rem,10vw,3.4rem);line-height:.93;font-weight:900;font-stretch:125%;margin:.2rem 0 .2rem;color:var(--line)}
.title .sub{margin:0 0 1rem;color:var(--muted);font-weight:700}
.namebox label{display:block;font-weight:700;margin-bottom:.35rem}
.namebox input{width:100%;max-width:20rem;min-height:3rem;padding:.6rem .9rem;border-radius:12px;border:2px solid var(--rule);background:var(--surface)}
.howto{margin:.9rem 0 0;padding:0;list-style:none;font-size:.97rem}
.howto li{padding:.35rem 0;border-top:1px solid var(--rule)}
kbd{font-family:inherit;font-weight:700;background:var(--surface);border:2px solid var(--rule);border-bottom-width:3px;border-radius:6px;padding:0 .4rem}
.loot{text-align:center;margin:.5rem 0 1rem}
.loot .item{font-size:4.5rem;line-height:1;display:inline-block;animation:loot .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes loot{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.loot .iname{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:118%;font-size:1.3rem;margin:.4rem 0 0}
.big{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:125%;font-size:clamp(2.6rem,12vw,3.8rem);line-height:1;color:var(--gold);margin:.25rem 0}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.rank{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:120%;font-size:1.5rem;color:var(--line);margin:.25rem 0 .75rem}
.bars{list-style:none;margin:1rem 0;padding:0;display:grid;gap:.8rem}
.bars li{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .6rem;align-items:center}
.bars .ic{font-size:1.4rem;grid-row:span 2}
.bars .bar{grid-column:2/-1;height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--line)}
.bars li.weak .bar i{background:var(--signal)}
.bars .lbl{font-weight:700}
.note{background:var(--surface);border-radius:14px;padding:.9rem 1rem;margin-top:1rem;border:2px dashed var(--rule)}
.note p{margin:0 0 .4rem}.note p:last-child{margin:0}
.fbk{background:var(--surface);border-radius:14px;padding:.9rem 1rem;margin-top:1rem;border-left:6px solid var(--ok)}
.fbk.pot{border-left-color:var(--signal)}
.fbk h2{font-size:1.1rem;font-weight:900;margin:0 0 .5rem}
.fbk ul{margin:0;padding:0;list-style:none;display:grid;gap:.65rem}
.fbk li b{display:block}
.fbk li span{display:block;font-size:.95rem;color:var(--muted)}
.fbk li em{font-style:normal;font-weight:700;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="stars" id="stars" aria-live="polite">⭐ 0</span>
    <span class="streak" id="streak"></span>
    <span class="inv" id="inv" aria-label="Inventar"></span>
  </div>
  <div class="quest" id="quest" aria-live="polite">Quest</div>
  <div class="stage"><canvas id="cv" aria-label="Spielfeld: Bewegen Sie die Figur mit den Pfeiltasten"></canvas></div>
  <div class="hint" id="hint"></div>
  <div class="pad">
    <div class="dpad" aria-label="Steuerkreuz">
      <button class="u" data-d="up" aria-label="hoch">▲</button>
      <button class="l" data-d="left" aria-label="links">◀</button>

</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
/* ================= Inhalte ================= */
const NAVI="🧭";
const PLACES=[
  {name:"Rathausplatz",icon:"🏛️",item:"🗝️",iname:"Schlüssel der Rechtsordnung",chap:"Kapitel 2.1 und 2.2"},
  {name:"Shoppingcenter",icon:"🛍️",item:"🪪",iname:"Ausweis der Handlungsfähigkeit",chap:"Kapitel 2.3 und 2.4"},
  {name:"Lehrbetrieb",icon:"🏭",item:"📜",iname:"Siegel des Lehrvertrags",chap:"Kapitel 2.5 und 2.6"},
  {name:"Pausenraum",icon:"☕",item:"🤝",iname:"Karte der Konfliktlösung",chap:"Kapitel 2.6 und 2.7"}
];
const RF=["Richtig","Falsch"], REGEL=["Rechtliche Regel","Betriebliche oder gesellschaftliche Regel","Moralische Vorstellung"];
// a = Index der richtigen Antwort; fix = Reihenfolge nicht mischen
const NPCS=[
/* ---------- Rathausplatz ---------- */
{z:0,x:5,y:16,av:"🧑",name:"Stadtführer Jonas",qs:[
 {c:"Lernende sind gegenüber dem Lehrbetrieb die schwächere Seite. Das Gesetz schreibt deshalb vor, dass der Betrieb ihre Gesundheit schützen muss.",
  q:"Welche Funktion des Rechts zeigt sich hier?",opts:["Schutz","Ordnung","Sicherheit","Konfliktlösung"],a:0,
  why:"Das Recht schützt die schwächere Seite: Lernende gegenüber dem Betrieb, Mieterinnen gegenüber Vermietern, Kundinnen gegenüber grossen Firmen."},
 {q:"Die Schweiz ist ein Rechtsstaat. Was bedeutet das?",opts:["Alle sind an das Recht gebunden, auch die Mächtigen.","Der Staat darf alles bestimmen.","Jede Person hat immer recht.","Nur Richterinnen und Richter müssen sich an Gesetze halten."],a:0,
  why:"In einem Rechtsstaat gelten die Regeln für alle, auch für jene, die Geld, Macht und Einfluss haben. Auch der Staat selbst muss sich an das Recht halten."}]},
{z:0,x:11,y:16,av:"👵",name:"Frau Huber",qs:[
 {c:"Noah bietet im Tram einer älteren Person seinen Sitzplatz nicht an.",
  q:"Welche Art von Regel verletzt Noah?",fix:true,opts:REGEL,a:2,
  why:"Die Regel steht in keinem Gesetz und in keinem Vertrag. Eine rechtliche Folge hat Noah nicht zu erwarten, höchstens böse Blicke (soziale Sanktion)."},
 {q:"Recht, Moral, Ethik: Welche Frage stellt die Ethik?",opts:["Warum ist das richtig, und ist es gerecht?","Was gilt?","Was gehört sich?","Wer bezahlt die Busse?"],a:0,
  why:"Das Recht fragt: Was gilt? Die Moral fragt: Was gehört sich? Die Ethik denkt über beides nach und fragt nach den Gründen. Sie ist die Grundlage, um Regeln zu verändern."}]},
{z:0,x:3,y:19,av:"👷",name:"Sam, Lernender Logistik",qs:[
 {c:"In Ihrem Lehrbetrieb gilt: Während der Arbeit bleibt das Handy im Spind.",
  q:"Welche Art von Regel ist das?",fix:true,opts:REGEL,a:1,
  why:"Der Betrieb hat die Regel festgelegt. Sie gilt in dieser Organisation und stützt sich auf den Lehrvertrag. Ein Verstoss kann deshalb trotzdem eine rechtliche Folge haben, zum Beispiel eine Verwarnung."},
 {c:"Elira sagt: «Diese Regel ist unfair, also gilt sie auch nicht.»",
  q:"Stimmt Eliras Aussage?",fix:true,opts:RF,a:1,
  why:"Ob eine Regel gilt, ist eine rechtliche Frage: Steht sie in einem Gesetz, einem Vertrag oder einer Weisung? Ob sie gerecht ist, ist eine Frage der Moral. Eine Regel kann gelten, obwohl viele sie unfair finden. Ändern kann man sie über die Politik."}]},
{z:0,x:12,y:20,av:"👮",name:"Polizist Brunner",qs:[
 {c:"Luca fährt mit dem Velo über Rot. Die Polizei büsst ihn.",
  q:"Welcher Rechtsbereich ist betroffen?",fix:true,opts:["Öffentliches Recht","Privates Recht"],a:0,
  why:"Der Staat steht Luca gegenüber und handelt mit hoheitlicher Macht: Er büsst."},
 {c:"Leilas neues Smartphone ist nach zwei Tagen kaputt. Sie verlangt vom Geschäft ein neues Gerät.",
  q:"Welcher Rechtsbereich ist betroffen?",fix:true,opts:["Öffentliches Recht","Privates Recht"],a:1,
  why:"Leila und das Geschäft stehen sich auf Augenhöhe gegenüber. Es geht um einen Kaufvertrag. Der Staat mischt sich erst ein, wenn der Fall vor Gericht kommt."}]},
{z:0,x:8,y:15,av:"🎩",name:"Gemeindeschreiber Vogt",qs:[
 {
  q:"Die Schweizer Rechtsordnung hat drei Stufen. Welche Reihenfolge stimmt, wenn Sie mit der grundlegendsten Regel beginnen, auf der alle anderen aufbauen?",opts:["Verfassung, Gesetz, Verordnung","Gesetz, Verfassung, Verordnung","Verordnung, Gesetz, Verfassung","Verfassung, Verordnung, Gesetz"],a:0,
  why:"Die Verfassung ist die Grundlage für alles: Sie legt fest, wie der Staat aufgebaut ist, und garantiert die Grundrechte. Die Gesetze regeln einzelne Bereiche genauer. Die Verordnungen bestimmen, wie ein Gesetz im Detail umgesetzt wird. Keine Regel darf der Stufe widersprechen, auf der sie aufbaut."},
 {c:"Sie lösen einen Fall und wollen belegen, wo die Regel steht: im Obligationenrecht, Artikel 345a, Absatz 1.",
  q:"Wie zitieren Sie diese Fundstelle korrekt?",opts:["Art. 345a Abs. 1 OR","OR, Seite 345","Gesetz Nr. 345a, 1. Zeile","Obligationenrecht, Kapitel 345a"],a:0,
  why:"Zu einer Fundstelle gehören der Artikel, bei Bedarf der Absatz und die Abkürzung des Gesetzes. So findet jede Person die Stelle in Sekunden. In diesem Atelier gilt: Jede rechtliche Antwort braucht eine Fundstelle."}]},

/* ---------- Shoppingcenter ---------- */
{z:1,x:20,y:17,av:"👵",name:"Milas Grossmutter",qs:[
 {c:"Mila ist drei Monate alt. Ihre Grossmutter schenkt ihr 2000 Franken.",
  q:"Kann Mila das Geld besitzen?",opts:["Ja, jeder Mensch ist rechtsfähig.","Nein, erst ab 18 Jahren.","Nein, erst wenn sie urteilsfähig ist.","Nur wenn ein Gericht zustimmt."],a:0,
  why:"Rechtsfähig ist jeder Mensch, von der Geburt bis zum Tod. Mila wird Eigentümerin. Über das Geld verfügen dürfen aber nur ihre Eltern als gesetzliche Vertretung.",ref:"Art. 11 ZGB"},
 {c:"Aron ist 15. Er versteht, was es bedeutet, mit seinem eigenen Geld ein T-Shirt für 40 Franken zu kaufen.",
  q:"Welche Aussage über Aron stimmt?",opts:["Er ist rechtsfähig und urteilsfähig, aber nicht voll handlungsfähig.","Er ist voll handlungsfähig.","Er ist nicht rechtsfähig.","Er ist nicht urteilsfähig, weil er unter 16 ist."],a:0,
  why:"Aron ist rechtsfähig wie jeder Mensch und in dieser Situation urteilsfähig. Voll handlungsfähig ist er nicht, weil er minderjährig ist. Er ist beschränkt handlungsfähig.",ref:"Art. 11, Art. 16 und Art. 19 ZGB"}]},
{z:1,x:23,y:20,av:"🧑",name:"Amir",qs:[
 {c:"Ein Kollege sagt: «Urteilsfähig ist man ab 16 Jahren.»",
  q:"Stimmt diese Aussage?",fix:true,opts:RF,a:1,
  why:"Das Gesetz nennt für die Urteilsfähigkeit kein Alter. Es kommt auf die Situation an: Versteht die Person, was sie tut und welche Folgen es hat? Dieselbe Person kann am Morgen urteilsfähig sein und am Abend nach fünf Bier nicht.",ref:"Art. 16 ZGB"},
 {c:"«Meine Schwester ist 17 und möchte etwas Wichtiges unterschreiben. Sie sagt, sie verstehe alles. Unsere Eltern sind dagegen.» Mehr wissen Sie nicht.",
  q:"Darf die Schwester allein unterschreiben?",opts:["Nicht bestimmbar: Es fehlt, um welches Geschäft es geht.","Ja, weil sie alles versteht.","Nein, unter 18 darf man nie unterschreiben.","Ja, weil sie fast volljährig ist."],a:0,
  why:"Die Schwester ist beschränkt handlungsfähig. Ob sie allein unterschreiben darf, hängt vom Geschäft ab: Ein Kauf vom eigenen Lohn ginge allein, eine Verpflichtung mit Laufzeit oder hohem Betrag nur mit Zustimmung. Eine gute Falllösung sagt, wenn eine Information fehlt.",ref:"Art. 19 ZGB"}]},
{z:1,x:21,y:15,av:"🧔",name:"Verkäufer Marco",qs:[
 {q:"Wer ist voll handlungsfähig?",opts:["Wer volljährig und urteilsfähig ist","Wer volljährig ist","Wer urteilsfähig ist","Wer einen eigenen Lohn verdient"],a:0,
  why:"Es braucht beides: Volljährigkeit und Urteilsfähigkeit. Wer mit 17 alles versteht, ist noch nicht voll handlungsfähig. Wer mit 30 betrunken ist, in diesem Moment auch nicht.",ref:"Art. 13, Art. 14 und Art. 16 ZGB"},
 {c:"Eine Kundin legt ein Sandwich auf das Band, bezahlt und geht. Niemand sagt ein Wort.",
  q:"Ist ein Vertrag zustande gekommen?",opts:["Ja, ein Vertrag kann auch stillschweigend entstehen.","Nein, es wurde nichts unterschrieben.","Nein, es wurde nichts gesagt.","Nur, wenn die Kundin die Quittung behält."],a:0,
  why:"Ein Vertrag kommt zustande, wenn sich zwei Seiten einig sind. Das geht mündlich, schriftlich oder stillschweigend. Die meisten Verträge brauchen keine bestimmte Form.",ref:"Art. 1 und Art. 11 OR"}]},
{z:1,x:29,y:15,av:"👩",name:"Autohändlerin Frey",qs:[
 {c:"David ist 30. Im Vollrausch unterschreibt er einen Kaufvertrag für ein teures Auto.",
  q:"Was gilt für diesen Vertrag?",opts:["Er ist nichtig.","Er ist gültig, weil David volljährig ist.","Er ist gültig, wenn David ihn nicht innert einer Woche kündigt.","Er braucht die Zustimmung von Davids Eltern."],a:0,
  why:"Im Vollrausch ist David nicht urteilsfähig und damit nicht handlungsfähig. Was in diesem Zustand unterschrieben wird, ist von Anfang an unwirksam.",ref:"Art. 17 und Art. 18 ZGB"},

function blocked(x,y){
  if(x<0||y<0||x>=W||y>=H)return true;
  if(solid.has(K(x,y))||npcAt.has(K(x,y)))return true;
  if(x===TROPHY.x&&y===TROPHY.y)return true;
  const g=gateAt(x,y); return !!(g&&!gateOpen(g));
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function drawHud(pop){
  const st=$("stars"); st.textContent="⭐ "+total();
  if(pop){st.classList.remove("pop");void st.offsetWidth;st.classList.add("pop")}
  $("streak").textContent=G.streak>=3?`🔥 ${G.streak} in Serie`:"";
  $("inv").innerHTML=PLACES.map((p,k)=>`<span class="slot ${zoneDone(k)?"full":""}" title="${zoneDone(k)?esc(p.iname):"leer"}">${zoneDone(k)?p.item:""}</span>`).join("");
  let z=[0,1,2,3].find(k=>!zoneDone(k)), q;
  if(z===undefined) q="Quest: Holen Sie sich den Pokal 🏆 im Pausenraum.";
  else if(zoneOf(G.x,G.y)!==z && z>0 && !(G.y===11||G.y===12||G.x===16||G.x===17)) q=`Quest: Gehen Sie durch das offene Tor zum Ort «${PLACES[z].name}» ${PLACES[z].icon}.`;
  else q=`Quest ${z+1} von 4: Helfen Sie allen Personen mit ❗ am Ort «${PLACES[z].name}» (${zoneCount(z)} von ${zoneNPC(z).length}).`;
  $("quest").textContent=q;
}

    drawHud(ok&&!retry);
    const thanks=ok&&!retry?`<p>${esc(n.name.split(",")[0])} bedankt sich${G.player?" bei "+esc(G.player):""}. +1 ⭐</p>`:"";
    const st=ok&&!retry&&G.streak>=3&&G.streak%3===0?`<p>🔥 ${G.streak} richtige Antworten in Serie!</p>`:"";
    $("fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}">${nav(`<p class="verdict">${ok?pick(OK_LINES):pick(NO_LINES)}</p><p>${esc(q.why)}</p>${q.ref?`<span class="ref">Fundstelle: ${esc(q.ref)}</span>`:""}${thanks}${st}`)}</div>
      <div class="row"><button class="btn" id="next">Weiter</button></div>`;
    const nx=$("next"); nx.onclick=()=>done(ok); nx.focus({preventScroll:true}); $("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
  });
}
function loot(z){
  const p=PLACES[z],s=zoneScore(z),m=zoneMax(z);
  const msg=s===m?"Perfekt, alles richtig!":s>=m-2?"Sehr gut!":s>=m/2?"Gut gemacht.":"Geschafft, aber dieses Thema sollten Sie repetieren.";
  const nextTxt=z<3?`Das Tor zum Ort «${PLACES[z+1].name}» ${PLACES[z+1].icon} ist jetzt offen.`:"Jetzt fehlt nur noch eines: Holen Sie sich den Pokal 🏆 hier im Pausenraum!";
  open(`<p class="qmeta">${p.icon} ${p.name} geschafft</p>
    <div class="loot"><span class="item" aria-hidden="true">${p.item}</span><p class="iname">${esc(p.iname)}</p></div>
    ${nav(`<p>${s} von ${m} Fragen richtig. ${msg}</p><p>${nextTxt}</p>`)}
    <div class="row"><button class="btn" data-focus id="x">Weiter</button></div>`);
  $("x").onclick=close;
}
function feedbackHTML(){
  const st=TOPICS.map(()=>[0,0]);
  NPCS.forEach(n=>n.qs.forEach((q,qi)=>{const t=TMAP[n.id][qi];st[t][1]++;if(G.ans[aKey(n,qi)]===true)st[t][0]++}));
  const good=[],pot=[];
  st.forEach((s,t)=>{if(!s[1])return;(s[0]===s[1]?good:pot).push({t,r:s[0],m:s[1]})});
  pot.sort((a,b)=>a.r/a.m-b.r/b.m);
  let h="";
  h+=`<div class="fbk"><h2>💪 Das können Sie schon gut</h2>${good.length?`<ul>${good.map(o=>`<li><b>${esc(TOPICS[o.t][0])}</b><span>Alle ${o.m===1?"Fragen":o.m+" Fragen"} richtig (${TOPICS[o.t][1]})</span></li>`).join("")}</ul>`:`<p>Noch kein Thema ganz ohne Fehler. Das ist kein Problem: Unten sehen Sie genau, wo Sie ansetzen können.</p>`}</div>`;
  h+=`<div class="fbk pot"><h2>🎯 Hier haben Sie noch Potenzial</h2>${pot.length?`<ul>${pot.map(o=>`<li><b>${esc(TOPICS[o.t][0])}</b><span><em>${o.r} von ${o.m} richtig</em>, ${TOPICS[o.t][1]} im Lehrmittel</span><span>Tipp: ${esc(TOPICS[o.t][2])}</span></li>`).join("")}</ul>`:`<p>Kein einziger Fehler. Sie sind bereit für die Prüfung.</p>`}</div>`;
  return h;
}
function wrongList(){const l=[];NPCS.forEach(n=>n.qs.forEach((q,qi)=>{if(G.ans[aKey(n,qi)]===false)l.push([n,qi])}));return l}
function finale(){
  const tot=total(); let rank=RANKS[0]; RANKS.forEach(r=>{if(tot>=r[0])rank=r});
  const weak=[0,1,2,3].filter(z=>zoneScore(z)<zoneMax(z)-2), wl=wrongList();
  open(`<p class="qmeta">Quest abgeschlossen</p>
    <p class="big">🏆 ${tot}<small> von ${TOTAL} ⭐</small></p>
    <p class="rank">${G.player?esc(G.player)+": ":""}${rank[1]}</p>
    ${nav(`<p>${rank[2]}</p>${G.best>=3?`<p>Längste Serie: 🔥 ${G.best}</p>`:""}`)}
    <ul class="bars">${PLACES.map((p,z)=>{const s=zoneScore(z),m=zoneMax(z);return `<li class="${s<m-2?"weak":""}"><span class="ic" aria-hidden="true">${p.icon}</span><span class="lbl">${p.name}</span><span>${s} von ${m}</span><span class="bar"><i style="width:${Math.round(s/m*100)}%"></i></span></li>`}).join("")}</ul>
    ${feedbackHTML()}
    <div class="note"><p>📸 Machen Sie jetzt einen Screenshot von Ihrem Feedback. Es ist Ihr Lernplan für die Prüfung.</p></div>
    <div class="row">${wl.length?`<button class="btn" data-focus id="rt">🔁 ${wl.length===1?"Den Fehler":"Die "+wl.length+" Fehler"} nochmals üben</button>`:""}
      <button class="btn ghost" id="back">Zurück in die Stadt</button><button class="btn ghost" id="again">Neue Quest</button></div>`);
  if(wl.length)$("rt").onclick=()=>retry(wl,0,0);
  $("back").onclick=close; $("again").onclick=()=>{clearSave();titleScreen()};
}
function retry(list,i,right){
  if(i>=list.length){open(`<p class="big">⭐ ${right}<small> von ${list.length} jetzt richtig</small></p>
    ${nav(`<p>${right===list.length?"Alle Fehler ausgebügelt. Bravo!":"Zu den restlichen Fragen lohnt sich ein Blick ins Lehrmittel."}</p>`)}
    <div class="row"><button class="btn" data-focus id="x">Zum Resultat</button></div>`);$("x").onclick=finale;return}
  ask(list[i][0],list[i][1],true,ok=>retry(list,i+1,right+(ok?1:0)),`Fehler üben: ${i+1} von ${list.length}`);
}
function titleScreen(){
  const s=load();
  G={mode:"title",x:4,y:21,dir:"up",mv:null,ans:{},player:"",streak:0,best:0,toast:"",toastT:0}; drawHud();hint();
  open(`<section class="title"><h1>Rechts-Navi: Die Quest</h1>
    <p class="sub">Repetition Atelier 2 «Rechte haben – Rechte bekommen»</p>
    ${nav(`<p>Hallo! Ich bin Navi. In dieser Stadt warten 20 Personen an vier Orten auf Ihre Hilfe. Laufen Sie zu ihnen und lösen Sie ihre Rechtsfragen.</p><p>Jeder Ort gibt einen Gegenstand und öffnet das Tor zum nächsten. Am Ende wartet der Pokal 🏆.</p>`)}
    <div class="namebox"><label for="nm">Wie heissen Sie im Spiel?</label><input id="nm" maxlength="20" autocomplete="off" placeholder="Spielname" value="${s&&s.player?esc(s.player):""}"></div>
    <ul class="howto"><li><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> oder <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>: laufen. Auf dem Handy: Steuerkreuz.</li>
      <li><kbd>Leertaste</kbd> oder «Sprechen»: Person ansprechen.</li><li><kbd>1</kbd> bis <kbd>4</kbd>: Antwort wählen, <kbd>Enter</kbd>: weiter.</li></ul>
    <div class="row">${s?`<button class="btn" data-focus id="cont">Weiterspielen (${Object.keys(s.ans).length} von ${TOTAL} Fragen)</button><button class="btn ghost" id="go">Neu beginnen</button>`:`<button class="btn" id="go">Quest starten</button>`}</div></section>`);
  const nm=()=>$("nm").value.trim();
  $("go").onclick=()=>{clearSave();G.player=nm();close();toast("Los geht’s! Die Personen mit ❗ brauchen Ihre Hilfe.")};
  if(s)$("cont").onclick=()=>{G.ans=s.ans;G.player=nm()||s.player||"";if(!blocked(s.x,s.y)){G.x=s.x;G.y=s.y}close()};
  $("nm").onkeydown=e=>{if(e.key==="Enter")(s?$("cont"):$("go")).click()};
}

resize(); titleScreen(); requestAnimationFrame(tick);
</script>
</body>
</html>
